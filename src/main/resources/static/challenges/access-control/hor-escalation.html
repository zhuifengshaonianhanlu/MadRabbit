<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Escalation - Merchant Orders</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 220px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .challenge-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; margin: 0 auto; }
        .info-box { background: rgba(212, 175, 55, 0.1); border-left: 3px solid var(--color-gold); padding: var(--spacing-sm); margin-bottom: var(--spacing-md); border-radius: 4px; }
        .info-box p { margin: 0; color: var(--color-text-secondary); font-size: 0.9rem; line-height: 1.6; }
        .info-box strong { color: var(--color-gold); }

        .orders-table-wrapper { overflow-x: auto; margin-bottom: var(--spacing-md); }
        .orders-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .orders-table th { background: rgba(212, 175, 55, 0.15); color: var(--color-gold); padding: 10px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid rgba(212, 175, 55, 0.3); }
        .orders-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--color-text-primary); }
        .orders-table tr:hover td { background: rgba(212, 175, 55, 0.05); }
        .decrypt-row-btn { background: rgba(212, 175, 55, 0.2); border: 1px solid rgba(212, 175, 55, 0.4); color: var(--color-gold-light); border-radius: 3px; padding: 4px 10px; cursor: pointer; font-size: 0.8rem; }
        .decrypt-row-btn:hover { background: rgba(212, 175, 55, 0.35); }

        .manual-query { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 6px; padding: var(--spacing-md); margin-bottom: var(--spacing-md); }
        .manual-query h3 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; font-size: 0.95rem; }
        .input-group { display: flex; gap: 8px; align-items: center; }
        .order-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; font-family: 'Courier New', monospace; }
        .order-input:focus { outline: none; border-color: var(--color-gold); }
        .action-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .decrypt-result { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.25); border-radius: 4px; border-left: 3px solid var(--color-gold); display: none; }
        .decrypt-result.visible { display: block; }
        .decrypt-result h4 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; font-size: 0.9rem; }
        .decrypt-field { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .decrypt-field:last-child { border-bottom: none; }
        .decrypt-label { color: var(--color-text-secondary); font-size: 0.85rem; }
        .decrypt-value { color: var(--color-text-primary); font-size: 0.9rem; font-family: 'Courier New', monospace; }
        .flag-display { margin-top: var(--spacing-sm); padding: var(--spacing-sm); background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 4px; color: var(--color-success); font-size: 0.9rem; }
        .error-display { margin-top: var(--spacing-sm); padding: var(--spacing-sm); background: rgba(255, 42, 42, 0.15); border: 1px solid rgba(255, 42, 42, 0.25); border-radius: 4px; color: var(--color-danger); font-size: 0.85rem; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; font-family: var(--font-display); }
        .tips-box ul { margin: 0; padding-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }

        @media (max-width: 768px) { .flag-input-inline { width: 160px; } .input-group { flex-direction: column; } .action-btn { width: 100%; } }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="hor.title">水平越权 - 商家订单中心</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="hor.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="hor.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="challenge-container">
            <!-- 订单表格 -->
            <div class="orders-table-wrapper">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th data-i18n="hor.colOrderNo">订单编号</th>
                            <th data-i18n="hor.colOrderTime">订单时间</th>
                            <th data-i18n="hor.colProduct">商品名称</th>
                            <th data-i18n="hor.colPrice">价格</th>
                            <th data-i18n="hor.colRecipient">收件人</th>
                            <th data-i18n="hor.colPhone">手机号</th>
                            <th data-i18n="hor.colAddress">地址</th>
                            <th data-i18n="hor.colAction">操作</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="8" style="text-align:center; color: var(--color-text-secondary);" data-i18n="hor.loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 手动查询区 -->
            <div class="manual-query">
                <h3 data-i18n="hor.manualTitle">手动查询订单明文</h3>
                <div class="input-group">
                    <input type="text" id="order-no-input" class="order-input" data-i18n-placeholder="hor.orderInputPlaceholder" placeholder="输入订单编号..." />
                    <button id="decrypt-btn" class="action-btn" data-i18n="hor.decryptBtn">解密查询</button>
                </div>
            </div>

            <!-- 解密结果展示 -->
            <div id="decrypt-result" class="decrypt-result">
                <h4 data-i18n="hor.decryptResultTitle">解密结果</h4>
                <div id="decrypt-content"></div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="hor.tips">提示</h3>
            <ul>
                <li data-i18n="hor.tip1">仔细观察订单编号的结构，它们看起来像是有规律的……</li>
                <li data-i18n="hor.tip2">这个系统里不只有你一个商家</li>
                <li data-i18n="hor.tip3">"解密"功能真的只为你服务吗？</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        const i18n = {
            'zh-CN': {
                'hor.title': '水平越权 - 商家订单中心',
                'hor.flagPlaceholder': '输入 Flag...',
                'hor.submit': '提交',
                'hor.scenario': '场景：',
                'hor.scenarioDesc': '你是当前登录的商家，以下是你的订单列表。收件人信息已脱敏，点击"查看明文"可解密单条订单的收件人信息。',
                'hor.colOrderNo': '订单编号',
                'hor.colOrderTime': '订单时间',
                'hor.colProduct': '商品名称',
                'hor.colPrice': '价格',
                'hor.colRecipient': '收件人',
                'hor.colPhone': '手机号',
                'hor.colAddress': '地址',
                'hor.colAction': '操作',
                'hor.loading': '加载中...',
                'hor.viewPlaintext': '查看明文',
                'hor.manualTitle': '手动查询订单明文',
                'hor.orderInputPlaceholder': '输入订单编号...',
                'hor.decryptBtn': '解密查询',
                'hor.decryptResultTitle': '解密结果',
                'hor.tips': '提示',
                'hor.tip1': '仔细观察订单编号的结构，它们看起来像是有规律的……',
                'hor.tip2': '这个系统里不只有你一个商家',
                'hor.tip3': '"解密"功能真的只为你服务吗？',
                'hor.enterOrderNo': '请输入订单编号',
                'hor.congrats': '恭喜！水平越权关卡完成！',
                'hor.enterFlag': '请输入 Flag',
                'hor.flagError': 'Flag 不正确',
                'hor.networkError': '网络错误，请稍后再试',
                'hor.orderNo': '订单编号',
                'hor.recipientName': '收件人姓名',
                'hor.recipientPhone': '手机号',
                'hor.recipientAddress': '地址'
            },
            'en-US': {
                'hor.title': 'Horizontal Escalation - Merchant Orders',
                'hor.flagPlaceholder': 'Enter Flag...',
                'hor.submit': 'Submit',
                'hor.scenario': 'Scenario:',
                'hor.scenarioDesc': 'You are the currently logged-in merchant. Below are your orders. Recipient info is masked. Click "View Plaintext" to decrypt.',
                'hor.colOrderNo': 'Order No.',
                'hor.colOrderTime': 'Order Time',
                'hor.colProduct': 'Product',
                'hor.colPrice': 'Price',
                'hor.colRecipient': 'Recipient',
                'hor.colPhone': 'Phone',
                'hor.colAddress': 'Address',
                'hor.colAction': 'Action',
                'hor.loading': 'Loading...',
                'hor.viewPlaintext': 'View Plaintext',
                'hor.manualTitle': 'Manual Order Decryption',
                'hor.orderInputPlaceholder': 'Enter order number...',
                'hor.decryptBtn': 'Decrypt',
                'hor.decryptResultTitle': 'Decryption Result',
                'hor.tips': 'Tips',
                'hor.tip1': 'Take a closer look at the order number structure... there seems to be a pattern.',
                'hor.tip2': 'You\'re not the only merchant in this system.',
                'hor.tip3': 'Does the "decrypt" feature truly serve only you?',
                'hor.enterOrderNo': 'Please enter an order number',
                'hor.congrats': 'Congratulations! Horizontal escalation challenge completed!',
                'hor.enterFlag': 'Please enter Flag',
                'hor.flagError': 'Incorrect flag',
                'hor.networkError': 'Network error, please try again later',
                'hor.orderNo': 'Order No.',
                'hor.recipientName': 'Recipient Name',
                'hor.recipientPhone': 'Phone',
                'hor.recipientAddress': 'Address'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        // 获取认证请求头
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            updateScenarioDesc();
            applyLanguage();
            loadOrders();
            window.addEventListener('languageChanged', () => { applyLanguage(); updateScenarioDesc(); });
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                    updateScenarioDesc();
                }
            });
        }

        // 动态更新场景描述，显示当前登录用户
        function updateScenarioDesc() {
            const user = getCurrentUser();
            const lang = getLang();
            const descEl = document.querySelector('[data-i18n="hor.scenarioDesc"]');
            if (descEl && user) {
                if (lang === 'zh-CN') {
                    descEl.textContent = `你是商家 ${user.username}（ID:${user.id}），以下是你的订单列表。收件人信息已脱敏，点击"查看明文"可解密单条订单的收件人信息。`;
                } else {
                    descEl.textContent = `You are merchant ${user.username} (ID:${user.id}). Below are your orders. Recipient info is masked. Click "View Plaintext" to decrypt.`;
                }
            }
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
            // Re-render table buttons with correct language
            document.querySelectorAll('.decrypt-row-btn').forEach(btn => {
                btn.textContent = t('hor.viewPlaintext');
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=access-control&vul_level=level1');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'access-control', vul_level: 'level1', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'access-control', level: 'level1', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('decrypt-btn').addEventListener('click', handleDecrypt);
            document.getElementById('order-no-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleDecrypt(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/challenge/access/hor/orders', {
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                const tbody = document.getElementById('orders-tbody');

                if (result.success && result.orders && result.orders.length > 0) {
                    let html = '';
                    for (const order of result.orders) {
                        html += `<tr>
                            <td><code>${order.orderNo}</code></td>
                            <td>${order.orderTime}</td>
                            <td>${order.productName}</td>
                            <td>&yen;${Number(order.price).toFixed(2)}</td>
                            <td>${order.recipientName}</td>
                            <td>${order.recipientPhone}</td>
                            <td>${order.recipientAddress}</td>
                            <td><button class="decrypt-row-btn" data-order="${order.orderNo}">${t('hor.viewPlaintext')}</button></td>
                        </tr>`;
                    }
                    tbody.innerHTML = html;

                    // Bind row decrypt buttons
                    tbody.querySelectorAll('.decrypt-row-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.getElementById('order-no-input').value = btn.dataset.order;
                            handleDecrypt();
                        });
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--color-text-secondary);">暂无订单数据</td></tr>';
                }
            } catch (error) {
                document.getElementById('orders-tbody').innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--color-danger);">' + t('hor.networkError') + '</td></tr>';
            }
        }

        async function handleDecrypt() {
            const orderNo = document.getElementById('order-no-input').value.trim();
            const resultDiv = document.getElementById('decrypt-result');
            const contentDiv = document.getElementById('decrypt-content');

            if (!orderNo) {
                resultDiv.classList.add('visible');
                contentDiv.innerHTML = '<div class="error-display">' + t('hor.enterOrderNo') + '</div>';
                return;
            }

            document.getElementById('decrypt-btn').disabled = true;

            try {
                const response = await fetch('/api/challenge/access/hor/order/decrypt', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ orderNo: orderNo })
                });
                const result = await response.json();
                resultDiv.classList.add('visible');

                if (result.success) {
                    let html = `
                        <div class="decrypt-field"><span class="decrypt-label">${t('hor.orderNo')}</span><span class="decrypt-value">${result.orderNo}</span></div>
                        <div class="decrypt-field"><span class="decrypt-label">${t('hor.recipientName')}</span><span class="decrypt-value">${result.recipientName}</span></div>
                        <div class="decrypt-field"><span class="decrypt-label">${t('hor.recipientPhone')}</span><span class="decrypt-value">${result.recipientPhone}</span></div>
                        <div class="decrypt-field"><span class="decrypt-label">${t('hor.recipientAddress')}</span><span class="decrypt-value">${result.recipientAddress}</span></div>
                    `;
                    if (result.flag) {
                        html += `<div class="flag-display"><strong>Flag:</strong> ${result.flag}<br/>${result.message}</div>`;
                    }
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<div class="error-display">' + result.message + '</div>';
                }
            } catch (error) {
                resultDiv.classList.add('visible');
                contentDiv.innerHTML = '<div class="error-display">' + t('hor.networkError') + '</div>';
            } finally {
                document.getElementById('decrypt-btn').disabled = false;
            }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');

            if (!submittedFlag) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('hor.enterFlag'); return; }

            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'access-control', vul_level: 'level1', flag: submittedFlag })
                });
                const result = await response.json();

                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('hor.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'access-control', level: 'level1' }, '*');
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('hor.flagError');
                }
            } catch (error) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('hor.networkError'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
