<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET型CSRF</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        html { height: 100%; }
        body { 
            margin: 0; 
            padding: var(--spacing-sm) var(--spacing-lg); 
            background: transparent; 
            color: var(--color-text-primary); 
            font-family: var(--font-body); 
            height: 100%;
            overflow: hidden;
        }
        .level-content {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            border-bottom: 1px solid transparent;
            background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat;
            flex-shrink: 0;
        }
        .level-content h1 { 
            font-family: var(--font-display); 
            font-size: clamp(1rem, 3vw, 1.8rem); 
            font-weight: 600; 
            color: var(--color-gold); 
            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .flag-submit-form { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-shrink: 0;
        }
        .flag-input-inline { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 4px; 
            padding: 8px 12px; 
            color: var(--color-text-primary); 
            font-family: 'Courier New', monospace; 
            font-size: 0.85rem; 
            width: 180px; 
        }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 4px; 
            padding: 8px 16px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .flag-submit-btn-small:hover { 
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); 
        }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }
        
        .main-container { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 6px; 
            padding: var(--spacing-md) var(--spacing-lg); 
            width: 100%;
            flex: 0 1 auto;
            min-height: 0;
            overflow: hidden;
        }
        .section-title {
            color: var(--color-gold);
            font-size: 1rem;
            margin-bottom: var(--spacing-sm);
            padding-bottom: var(--spacing-xs);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .current-email {
            background: rgba(0, 0, 0, 0.3);
            padding: var(--spacing-sm);
            border-radius: 4px;
            margin-bottom: var(--spacing-md);
            font-family: 'Courier New', monospace;
        }
        .current-email span { color: var(--color-gold-light); }
        .form-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        .form-input { 
            flex: 1;
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 3px; 
            padding: 0.75rem 1rem; 
            color: var(--color-text-primary); 
            font-size: 0.95rem; 
        }
        .form-input:focus { outline: none; border-color: var(--color-gold); }
        .action-btn { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 3px; 
            padding: 0.75rem 1.5rem; 
            font-size: 0.9rem; 
            font-weight: 600; 
            cursor: pointer; 
        }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .feedback { 
            margin-top: 0.5rem; 
            padding: 0.5rem; 
            border-radius: 3px; 
            font-size: 0.85rem; 
            min-height: 1.2em; 
        }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }
        
        .tips-box { 
            margin-top: var(--spacing-sm); 
            padding: var(--spacing-md); 
            background: rgba(212, 175, 55, 0.05); 
            border-left: 3px solid var(--color-gold); 
            border-radius: 4px;
            flex-shrink: 0;
        }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { 
            background: rgba(0, 0, 0, 0.3); 
            padding: 2px 6px; 
            border-radius: 3px; 
            font-family: 'Courier New', monospace;
            color: var(--color-gold-light);
        }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="csrfGet.title">GET型CSRF - 邮箱修改</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="csrfGet.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="csrfGet.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="main-container">
            <h3 class="section-title" data-i18n="csrfGet.currentEmail">当前邮箱</h3>
            <div class="current-email">
                <span id="current-email-display">loading...</span>
            </div>
            
            <h3 class="section-title" data-i18n="csrfGet.changeEmail">修改邮箱</h3>
            <div class="form-group">
                <input type="email" id="new-email" class="form-input" data-i18n-placeholder="csrfGet.emailPlaceholder" placeholder="输入新邮箱..." />
                <button id="change-btn" class="action-btn" data-i18n="csrfGet.changeBtn">修改</button>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="csrfGet.tips">提示</h3>
            <ul>
                <li data-i18n="csrfGet.tip1">一张图片能做的事，远比你想象的多</li>
                <li data-i18n="csrfGet.tip2">有些链接，点开不只是看看而已</li>
                <li data-i18n="csrfGet.tip3">你的浏览器很听话，谁的话都听</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        }

        const i18n = {
            'zh-CN': {
                'csrfGet.title': 'GET型CSRF - 邮箱修改',
                'csrfGet.flagPlaceholder': '输入 Flag...',
                'csrfGet.submit': '提交',
                'csrfGet.currentEmail': '当前邮箱',
                'csrfGet.changeEmail': '修改邮箱',
                'csrfGet.emailPlaceholder': '输入新邮箱...',
                'csrfGet.changeBtn': '修改',
                'csrfGet.tips': '提示',
                'csrfGet.tip1': '一张图片能做的事，远比你想象的多',
                'csrfGet.tip2': '有些链接，点开不只是看看而已',
                'csrfGet.tip3': '你的浏览器很听话，谁的话都听',
                'csrfGet.enterEmail': '请输入邮箱地址',
                'csrfGet.success': '邮箱修改成功！',
                'csrfGet.congrats': '恭喜！GET型CSRF关卡完成！',
                'csrfGet.enterFlag': '请输入 Flag',
                'csrfGet.flagError': 'Flag 不正确',
                'csrfGet.invalidEmail': '请输入有效的邮箱格式',
                'csrfGet.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'csrfGet.title': 'GET CSRF - Email Change',
                'csrfGet.flagPlaceholder': 'Enter Flag...',
                'csrfGet.submit': 'Submit',
                'csrfGet.currentEmail': 'Current Email',
                'csrfGet.changeEmail': 'Change Email',
                'csrfGet.emailPlaceholder': 'Enter new email...',
                'csrfGet.changeBtn': 'Change',
                'csrfGet.tips': 'Tips',
                'csrfGet.tip1': 'A picture can do more than you think',
                'csrfGet.tip2': 'Some links do more than just show content',
                'csrfGet.tip3': 'Your browser is obedient - it listens to everyone',
                'csrfGet.enterEmail': 'Please enter email address',
                'csrfGet.success': 'Email changed successfully!',
                'csrfGet.congrats': 'Congratulations! GET CSRF challenge completed!',
                'csrfGet.enterFlag': 'Please enter Flag',
                'csrfGet.flagError': 'Incorrect flag',
                'csrfGet.invalidEmail': 'Please enter a valid email format',
                'csrfGet.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            loadCurrentEmail();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=csrf&vul_level=level1', {
                    credentials: 'same-origin',
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    credentials: 'same-origin',
                    body: JSON.stringify({ vul_type: 'csrf', vul_level: 'level1', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'csrf', level: 'level1', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('change-btn').addEventListener('click', handleChangeEmail);
            document.getElementById('new-email').addEventListener('keypress', e => { if (e.key === 'Enter') handleChangeEmail(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function loadCurrentEmail() {
            try {
                const response = await fetch('/api/challenge/csrf/get/current-email', {
                    credentials: 'same-origin',
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                document.getElementById('current-email-display').textContent = result.email || 'user@example.com';
            } catch (error) {
                document.getElementById('current-email-display').textContent = 'user@example.com';
            }
        }

        async function handleChangeEmail() {
            const email = document.getElementById('new-email').value.trim();
            const feedbackEl = document.getElementById('feedback');
            if (!email) {
                feedbackEl.className = 'feedback error';
                feedbackEl.textContent = t('csrfGet.enterEmail');
                return;
            }
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }
            if (!isValidEmail(email)) {
                feedbackEl.textContent = t('csrfGet.invalidEmail');
                feedbackEl.className = 'feedback error';
                return;
            }
            try {
                const response = await fetch('/api/challenge/csrf/get/change-email?email=' + encodeURIComponent(email), {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                if (result.success) {
                    feedbackEl.className = 'feedback success';
                    feedbackEl.textContent = t('csrfGet.success') + (result.flag ? ' Flag: ' + result.flag : '');
                    loadCurrentEmail();
                } else {
                    feedbackEl.className = 'feedback error';
                    feedbackEl.textContent = result.message || t('csrfGet.networkError');
                }
            } catch (error) {
                feedbackEl.className = 'feedback error';
                feedbackEl.textContent = t('csrfGet.networkError');
            }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!flag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('csrfGet.enterFlag');
                return;
            }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    credentials: 'same-origin',
                    body: JSON.stringify({ vul_type: 'csrf', vul_level: 'level1', flag: flag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('csrfGet.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'csrf', level: 'level1' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('csrfGet.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('csrfGet.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
