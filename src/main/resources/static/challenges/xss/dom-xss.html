<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM XSS</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: var(--spacing-lg); 
            background: transparent; 
            color: var(--color-text-primary); 
            font-family: var(--font-body); 
            min-height: 100vh;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: var(--spacing-md);
            padding-bottom: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat;
        }
        .level-content h1 { 
            font-family: var(--font-display); 
            font-size: clamp(1rem, 3vw, 1.8rem); 
            font-weight: 600; 
            color: var(--color-gold); 
            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .flag-submit-form { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-shrink: 0;
        }
        .flag-input-inline { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 4px; 
            padding: 8px 12px; 
            color: var(--color-text-primary); 
            font-family: 'Courier New', monospace; 
            font-size: 0.85rem; 
            width: 180px; 
        }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 4px; 
            padding: 8px 16px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .flag-submit-btn-small:hover { 
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); 
        }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }
        
        .greeting-container { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 6px; 
            padding: 1.5rem; 
            max-width: 600px; 
            margin: 0 auto;
        }
        .section-title {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--color-gold);
            margin-bottom: var(--spacing-sm);
            padding-bottom: var(--spacing-xs);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .input-form { 
            display: flex; 
            gap: 8px; 
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        .name-input { 
            flex: 1;
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 3px; 
            padding: 0.75rem 1rem; 
            color: var(--color-text-primary); 
            font-size: 0.95rem; 
        }
        .name-input:focus { outline: none; border-color: var(--color-gold); }
        .greet-btn { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 3px; 
            padding: 0.75rem 1.5rem; 
            font-size: 0.9rem; 
            font-weight: 600; 
            cursor: pointer; 
            letter-spacing: 1px;
        }
        .greet-btn:hover { 
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); 
        }
        
        .greet-feedback { 
            margin-top: 0.5rem; 
            padding: 0.5rem; 
            border-radius: 3px; 
            font-size: 0.8rem; 
            text-align: center; 
            min-height: 1.2em; 
        }
        .greet-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .greet-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }
        
        .greeting-display {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            min-height: 100px;
            text-align: center;
        }
        .greeting-text {
            font-size: 1.5rem;
            color: var(--color-text-primary);
        }
        .greeting-text strong {
            color: var(--color-gold);
        }
        .greeting-placeholder {
            color: var(--color-text-secondary);
            font-style: italic;
        }
        
        .code-hint-box {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .code-hint-title {
            font-size: 0.85rem;
            color: var(--color-gold);
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .code-hint-title::before {
            content: "💡";
        }
        .code-block {
            background: rgba(0, 0, 0, 0.5);
            padding: var(--spacing-sm);
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #00ff88;
            overflow-x: auto;
            white-space: pre;
        }
        .code-comment {
            color: #6a9955;
        }
        .code-string {
            color: #ce9178;
        }
        .code-keyword {
            color: #569cd6;
        }
        
        .tips-box { 
            margin-top: var(--spacing-xl); 
            padding: var(--spacing-md); 
            background: rgba(212, 175, 55, 0.05); 
            border-left: 3px solid var(--color-gold); 
            border-radius: 4px; 
        }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { 
            background: rgba(0, 0, 0, 0.3); 
            padding: 2px 6px; 
            border-radius: 3px; 
            font-family: 'Courier New', monospace;
            color: var(--color-gold-light);
        }
        @media (max-width: 768px) {
            .flag-input-inline { width: 140px; }
            .input-form { flex-direction: column; }
            .greet-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="level-content">
        <!-- 头部区域 -->
        <div class="header-section">
            <h1 id="page-title" data-i18n="domXss.title">DOM型XSS - 客户端注入</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="domXss.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="domXss.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <!-- 问候容器 -->
        <div class="greeting-container">
            <!-- 输入表单 -->
            <div class="section-title" data-i18n="domXss.inputName">输入你的名字</div>
            <div class="input-form">
                <input type="text" id="name-input" class="name-input" data-i18n-placeholder="domXss.namePlaceholder" placeholder="输入名字..." autocomplete="off" />
                <button id="greet-btn" class="greet-btn" data-i18n="domXss.greetBtn">问候</button>
            </div>
            <div id="greet-feedback" class="greet-feedback"></div>
            
            <!-- 欢迎信息显示区域 -->
            <div class="section-title" data-i18n="domXss.welcomeMessage">欢迎信息</div>
            <div id="greeting-display" class="greeting-display">
                <div class="greeting-placeholder" data-i18n="domXss.initialHint">输入名字查看欢迎信息</div>
            </div>
            
            <!-- 源码提示区域 -->
            <div class="code-hint-box">
                <div class="code-hint-title" data-i18n="domXss.codeHintTitle">页面源码提示</div>
                <div class="code-block"><span class="code-comment">// 提示：页面使用以下代码渲染</span>
<span class="code-keyword">const</span> name = document.getElementById(<span class="code-string">'name-input'</span>).value;
element.<span class="code-keyword">innerHTML</span> = <span class="code-string">"Welcome, "</span> + name + <span class="code-string">"!"</span>;</div>
            </div>
        </div>

        <!-- 提示 -->
        <div class="tips-box">
            <h3 data-i18n="domXss.tips">提示</h3>
            <ul>
                <li data-i18n="domXss.tip1">注意页面如何渲染name参数</li>
                <li data-i18n="domXss.tip2">innerHTML是危险的DOM操作</li>
                <li><span data-i18n="domXss.tip3Prefix">尝试构造包含事件处理器的输入，如</span> <code>&lt;img src=x onerror=alert(1)&gt;</code></li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentFlag = null;

        // 国际化翻译
        const i18n = {
            'zh-CN': {
                'domXss.title': 'DOM型XSS - 客户端注入',
                'domXss.flagPlaceholder': '输入 Flag...',
                'domXss.submit': '提交',
                'domXss.inputName': '输入你的名字',
                'domXss.namePlaceholder': '输入名字...',
                'domXss.greetBtn': '问候',
                'domXss.welcomeMessage': '欢迎信息',
                'domXss.initialHint': '输入名字查看欢迎信息',
                'domXss.codeHintTitle': '页面源码提示',
                'domXss.tips': '提示',
                'domXss.tip1': '注意页面如何渲染name参数',
                'domXss.tip2': 'innerHTML是危险的DOM操作',
                'domXss.tip3Prefix': '尝试构造包含事件处理器的输入，如',
                'domXss.enterName': '请输入名字',
                'domXss.congrats': '恭喜！DOM型XSS关卡完成！',
                'domXss.enterFlag': '请输入 Flag',
                'domXss.flagError': 'Flag 不正确',
                'domXss.networkError': '网络错误，请稍后再试',
                'domXss.xssTriggered': 'XSS触发！你执行了JavaScript代码。'
            },
            'en-US': {
                'domXss.title': 'DOM XSS - Client-side Injection',
                'domXss.flagPlaceholder': 'Enter Flag...',
                'domXss.submit': 'Submit',
                'domXss.inputName': 'Enter your name',
                'domXss.namePlaceholder': 'Enter name...',
                'domXss.greetBtn': 'Greet',
                'domXss.welcomeMessage': 'Welcome Message',
                'domXss.initialHint': 'Enter a name to see the welcome message',
                'domXss.codeHintTitle': 'Source Code Hint',
                'domXss.tips': 'Tips',
                'domXss.tip1': 'Notice how the page renders the name parameter',
                'domXss.tip2': 'innerHTML is a dangerous DOM operation',
                'domXss.tip3Prefix': 'Try constructing input with event handlers, like',
                'domXss.enterName': 'Please enter a name',
                'domXss.congrats': 'Congratulations! DOM XSS challenge completed!',
                'domXss.enterFlag': 'Please enter Flag',
                'domXss.flagError': 'Incorrect flag',
                'domXss.networkError': 'Network error, please try again later',
                'domXss.xssTriggered': 'XSS Triggered! You executed JavaScript code.'
            }
        };

        // 获取当前语言
        function getLang() {
            return localStorage.getItem('lang') || 'en-US';
        }

        // 获取翻译文本
        function t(key) {
            const lang = getLang();
            return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key;
        }

        // 显示反馈信息
        function showFeedback(element, type, message) {
            element.className = 'greet-feedback ' + type;
            element.textContent = message;
        }

        // 覆写 window.alert，当 alert 被触发时显示提示
        const originalAlert = window.alert;
        window.alert = function(message) {
            const feedbackEl = document.getElementById('greet-feedback');
            showFeedback(feedbackEl, 'success', t('domXss.xssTriggered'));
            // 调用后端获取 flag
            fetchGreeting(document.getElementById('name-input').value);
            // 仍然执行原始 alert
            originalAlert.call(window, message);
        };

        // 初始化
        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            checkUrlParams();
            
            // 监听语言切换事件（本地）
            window.addEventListener('languageChanged', applyLanguage);
            
            // 监听父页面发送的语言切换消息（iframe 通信）
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        // 应用语言
        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) {
                    el.placeholder = i18n[lang][key];
                }
            });
        }

        // 检查URL参数
        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            if (name) {
                document.getElementById('name-input').value = name;
                handleGreet();  // 自动触发
            }
        }

        // 查询并更新关卡状态
        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=xss&vul_level=level3');
                const result = await response.json();
                if (result.status === '未开始') {
                    await updateChallengeStatus('进行中');
                }
            } catch (error) {
                console.error('查询关卡状态失败:', error);
            }
        }

        // 更新关卡状态
        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'xss', vul_level: 'level3', status: status })
                });
                
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'challengeStatusChanged',
                        vulnType: 'xss',
                        level: 'level3',
                        status: status
                    }, '*');
                }
            } catch (error) {
                console.error('更新关卡状态失败:', error);
            }
        }

        // 绑定事件
        function bindEvents() {
            document.getElementById('greet-btn').addEventListener('click', handleGreet);
            document.getElementById('name-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleGreet(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        // DOM型XSS - 核心漏洞逻辑
        function handleGreet() {
            const nameInput = document.getElementById('name-input').value;
            const greetingDiv = document.getElementById('greeting-display');
            const feedbackEl = document.getElementById('greet-feedback');
            
            if (!nameInput || nameInput.trim() === '') {
                showFeedback(feedbackEl, 'error', t('domXss.enterName'));
                return;
            }
            
            feedbackEl.textContent = '';
            feedbackEl.className = 'greet-feedback';
            
            // 【漏洞核心】直接用innerHTML渲染用户输入 - DOM型XSS
            greetingDiv.innerHTML = '<div class="greeting-text">Welcome, <strong>' + nameInput + '</strong> !</div>';
            
            // 同时调用后端API获取flag（如果payload包含XSS特征）
            fetchGreeting(nameInput);
        }

        async function fetchGreeting(name) {
            try {
                const response = await fetch('/api/challenge/xss/dom/greeting?name=' + encodeURIComponent(name));
                const result = await response.json();
                
                if (result.flag) {
                    currentFlag = result.flag;
                    const feedbackEl = document.getElementById('greet-feedback');
                    showFeedback(feedbackEl, 'success', 'XSS Detected! Flag: ' + result.flag);
                }
            } catch (error) {
                console.error('获取问候信息失败:', error);
            }
        }

        // 处理 Flag 提交
        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            
            if (!submittedFlag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('domXss.enterFlag');
                return;
            }
            
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'xss', vul_level: 'level3', flag: submittedFlag })
                });
                const result = await response.json();
                
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('domXss.congrats');
                    await updateChallengeStatus('已完成');
                    
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: 'challengeCompleted',
                            vulnType: 'xss',
                            level: 'level3'
                        }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('domXss.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('domXss.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
