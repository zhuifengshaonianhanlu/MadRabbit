<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令注入</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .ping-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        .ping-form { display: flex; gap: 8px; align-items: center; margin-bottom: var(--spacing-md); }
        .ping-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; font-family: 'Courier New', monospace; }
        .ping-input:focus { outline: none; border-color: var(--color-gold); }
        .ping-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .ping-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .ping-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .ping-feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .ping-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .ping-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .cmd-preview { margin-top: var(--spacing-sm); padding: var(--spacing-xs); background: rgba(0, 0, 0, 0.3); border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--color-text-secondary); }
        .cmd-preview span { color: var(--color-gold-light); }
        .cmd-toggle {
            cursor: pointer;
            margin-left: 8px;
            color: var(--color-text-secondary);
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .cmd-toggle:hover {
            opacity: 1;
            color: var(--color-gold-light);
        }

        .output-box { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.5); border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.1); min-height: 150px; max-height: 300px; overflow-y: auto; }
        .output-box pre { margin: 0; font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--color-text-primary); white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
        .output-box .injection-detected { color: var(--color-danger); font-weight: bold; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); margin-top: 0; }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; margin-bottom: 0; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 data-i18n="cmdInject.title">命令注入 - 网络诊断</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="cmdInject.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="ping-container">
            <p style="color: var(--color-text-secondary); margin-bottom: var(--spacing-md); font-size: 0.9rem;" data-i18n="cmdInject.desc">
                网络诊断工具 - 输入IP地址或域名进行Ping测试
            </p>
            <div class="ping-form">
                <input type="text" id="host-input" class="ping-input" placeholder="127.0.0.1" value="127.0.0.1" autocomplete="off" />
                <button id="ping-btn" class="ping-btn">
                    <span>📡</span>
                    <span data-i18n="cmdInject.pingBtn">Ping</span>
                </button>
            </div>
            <div id="ping-feedback" class="ping-feedback"></div>
            <div id="cmd-preview" class="cmd-preview" style="display: none;">
                <span>Command:</span>
                <span id="cmd-query-masked">*************************</span>
                <span id="cmd-query" style="display: none;"></span>
                <span id="cmd-toggle" class="cmd-toggle" title="显示/隐藏Command">
                    <svg id="eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                    <svg id="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </span>
            </div>
            <div id="output-box" class="output-box">
                <pre id="output-content">等待执行...</pre>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="cmdInject.tips">提示</h3>
            <ul>
                <li data-i18n="cmdInject.tip1">ping 只是开始，谁说一次只能执行一条命令？</li>
                <li data-i18n="cmdInject.tip2">在命令的世界里，有很多'连接词'可以让你说更多的话</li>
                <li data-i18n="cmdInject.tip3">试试让服务器在 ping 之余，再帮你做点别的事情</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentFlag = null;
        const cmdQueryMasked = document.getElementById('cmd-query-masked');
        const cmdToggle = document.getElementById('cmd-toggle');
        const eyeClosed = document.getElementById('eye-closed');
        const eyeOpen = document.getElementById('eye-open');
        let cmdVisible = false;

        const i18n = {
            'zh-CN': {
                'cmdInject.title': '命令注入 - 网络诊断',
                'cmdInject.submit': '提交',
                'cmdInject.desc': '网络诊断工具 - 输入IP地址或域名进行Ping测试',
                'cmdInject.pingBtn': 'Ping',
                'cmdInject.tips': '提示',
                'cmdInject.tip1': 'ping 只是开始，谁说一次只能执行一条命令？',
                'cmdInject.tip2': '在命令的世界里，有很多\'连接词\'可以让你说更多的话',
                'cmdInject.tip3': '试试让服务器在 ping 之余，再帮你做点别的事情',
                'cmdInject.enterHost': '请输入目标主机',
                'cmdInject.pinging': '执行中...',
                'cmdInject.congrats': '恭喜！命令注入关卡完成！',
                'cmdInject.enterFlag': '请输入 Flag',
                'cmdInject.flagError': 'Flag 不正确',
                'cmdInject.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'cmdInject.title': 'Command Injection - Network Diagnostics',
                'cmdInject.submit': 'Submit',
                'cmdInject.desc': 'Network diagnostic tool - Enter IP address or domain for Ping test',
                'cmdInject.pingBtn': 'Ping',
                'cmdInject.tips': 'Tips',
                'cmdInject.tip1': 'Ping is just the beginning - who says you can only run one command?',
                'cmdInject.tip2': 'In the command world, there are many \'conjunctions\' that let you say more',
                'cmdInject.tip3': 'Try getting the server to do something extra besides pinging',
                'cmdInject.enterHost': 'Please enter target host',
                'cmdInject.pinging': 'Executing...',
                'cmdInject.congrats': 'Congratulations! Command Injection completed!',
                'cmdInject.enterFlag': 'Please enter Flag',
                'cmdInject.flagError': 'Incorrect flag',
                'cmdInject.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=rce&vul_level=level1');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level1', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'rce', level: 'level1', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('ping-btn').addEventListener('click', handlePing);
            document.getElementById('host-input').addEventListener('keypress', e => { if (e.key === 'Enter') handlePing(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
            cmdToggle.addEventListener('click', function() {
                cmdVisible = !cmdVisible;
                if (cmdVisible) {
                    cmdQueryMasked.style.display = 'none';
                    document.getElementById('cmd-query').style.display = 'inline';
                    eyeClosed.style.display = 'none';
                    eyeOpen.style.display = 'inline';
                } else {
                    cmdQueryMasked.style.display = 'inline';
                    document.getElementById('cmd-query').style.display = 'none';
                    eyeClosed.style.display = 'inline';
                    eyeOpen.style.display = 'none';
                }
            });
        }

        async function handlePing() {
            const host = document.getElementById('host-input').value.trim();
            const feedbackEl = document.getElementById('ping-feedback');
            const pingBtn = document.getElementById('ping-btn');
            const cmdPreview = document.getElementById('cmd-preview');
            const cmdQuery = document.getElementById('cmd-query');
            const outputContent = document.getElementById('output-content');

            if (!host) {
                feedbackEl.className = 'ping-feedback error';
                feedbackEl.textContent = t('cmdInject.enterHost');
                return;
            }

            pingBtn.disabled = true;
            outputContent.textContent = t('cmdInject.pinging');
            feedbackEl.textContent = '';
            feedbackEl.className = 'ping-feedback';

            try {
                const response = await fetch('/api/challenge/rce/cmd/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ host: host })
                });
                const result = await response.json();

                if (result.command) {
                    cmdPreview.style.display = 'block';
                    cmdQuery.textContent = result.command;
                    cmdVisible = false;
                    cmdQueryMasked.style.display = 'inline';
                    cmdQuery.style.display = 'none';
                    eyeClosed.style.display = 'inline';
                    eyeOpen.style.display = 'none';
                }

                if (result.success) {
                    if (result.injection_detected && result.flag) {
                        currentFlag = result.flag;
                        feedbackEl.className = 'ping-feedback success';
                        feedbackEl.textContent = result.message + ' Flag: ' + result.flag;
                    }
                    outputContent.textContent = result.output || 'No output';
                } else {
                    feedbackEl.className = 'ping-feedback error';
                    feedbackEl.textContent = result.message || t('cmdInject.networkError');
                    outputContent.textContent = 'Error: ' + (result.message || 'Unknown error');
                }
            } catch (error) {
                feedbackEl.className = 'ping-feedback error';
                feedbackEl.textContent = t('cmdInject.networkError');
                outputContent.textContent = 'Network error';
            } finally {
                pingBtn.disabled = false;
            }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');

            if (!submittedFlag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('cmdInject.enterFlag');
                return;
            }

            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level1', flag: submittedFlag })
                });
                const result = await response.json();

                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('cmdInject.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'rce', level: 'level1' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('cmdInject.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('cmdInject.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
