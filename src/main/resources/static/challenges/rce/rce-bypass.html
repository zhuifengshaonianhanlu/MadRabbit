<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过滤绕过 - 日志查看器</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --color-info: #3b82f6;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .main-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
        .section-title { color: var(--color-gold); font-size: 1rem; margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-xs); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .scenario-desc { color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: var(--spacing-md); line-height: 1.6; }

        .rules-panel { margin-bottom: var(--spacing-md); }
        .rule-box { padding: var(--spacing-sm); border-radius: 4px; margin-bottom: 8px; }
        .rule-box.allow { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); }
        .rule-box.deny { background: rgba(255, 42, 42, 0.1); border: 1px solid rgba(255, 42, 42, 0.3); }
        .rule-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .rule-label.allow { color: var(--color-success); }
        .rule-label.deny { color: var(--color-danger); }
        .rule-items { display: flex; flex-wrap: wrap; gap: 6px; }
        .rule-item { padding: 3px 10px; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 0.8rem; }
        .rule-item.allow { background: rgba(34, 197, 94, 0.2); color: var(--color-success); }
        .rule-item.deny { background: rgba(255, 42, 42, 0.2); color: var(--color-danger); text-decoration: line-through; }

        .form-group { margin-bottom: var(--spacing-md); }
        .form-textarea { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; font-family: 'Courier New', monospace; resize: vertical; min-height: 60px; }
        .form-textarea:focus { outline: none; border-color: var(--color-gold); }
        .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .action-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .example-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 3px; padding: 6px 12px; color: var(--color-text-secondary); font-size: 0.8rem; font-family: 'Courier New', monospace; cursor: pointer; }
        .example-btn:hover { background: rgba(212, 175, 55, 0.15); color: var(--color-gold-light); border-color: var(--color-gold); }

        .feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.85rem; min-height: 1.2em; }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .output-container { margin-top: var(--spacing-md); }
        .output-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 4px; padding: var(--spacing-md); min-height: 150px; max-height: 300px; overflow-y: auto; }
        .output-box pre { margin: 0; font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--color-success); white-space: pre-wrap; word-break: break-all; }
        .output-box .waiting { color: var(--color-text-secondary); font-style: italic; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="rceBypass.title">过滤绕过 - 日志查看器</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="rceBypass.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="rceBypass.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="main-container">
            <h3 class="section-title" data-i18n="rceBypass.sectionTitle">受限日志查看器</h3>
            <p class="scenario-desc" data-i18n="rceBypass.scenarioDesc">管理员只允许使用 ls 和 cat 查看 /tmp/madx-app-logs/ 目录下的日志文件。后端实施了严格的白名单校验。</p>

            <!-- 白名单规则面板 -->
            <div class="rules-panel">
                <div class="rule-box allow">
                    <div class="rule-label allow" data-i18n="rceBypass.allowedLabel">允许的命令:</div>
                    <div class="rule-items">
                        <span class="rule-item allow">ls</span>
                        <span class="rule-item allow">cat</span>
                    </div>
                </div>
                <div class="rule-box allow">
                    <div class="rule-label allow" data-i18n="rceBypass.allowedPathLabel">允许的路径:</div>
                    <div class="rule-items">
                        <span class="rule-item allow">/tmp/madx-app-logs/</span>
                    </div>
                </div>
            </div>

            <!-- 命令输入 -->
            <div class="form-group">
                <textarea id="command-input" class="form-textarea" rows="3" data-i18n-placeholder="rceBypass.cmdPlaceholder" placeholder="输入命令..."></textarea>
            </div>
            <div class="btn-row">
                <button id="exec-btn" class="action-btn" data-i18n="rceBypass.execBtn">执行</button>
                <button class="example-btn" onclick="setExample('ls /tmp/madx-app-logs/')">ls /tmp/madx-app-logs/</button>
                <button class="example-btn" onclick="setExample('cat /tmp/madx-app-logs/access.log')">cat .../access.log</button>
                <button class="example-btn" onclick="setExample('cat /tmp/madx-app-logs/error.log')">cat .../error.log</button>
            </div>
            <div id="feedback" class="feedback"></div>

            <div class="output-container">
                <div class="output-box">
                    <pre id="output-content" class="waiting" data-i18n="rceBypass.waitingOutput">等待执行...</pre>
                </div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="rceBypass.tips">提示</h3>
            <ul>
                <li data-i18n="rceBypass.tip1">白名单过滤了所有常见的命令分隔符...真的全部了吗？</li>
                <li data-i18n="rceBypass.tip2">不是所有分隔符都是"可见字符"</li>
                <li data-i18n="rceBypass.tip3">试试在合法命令之后做点"换行"的事情</li>
                <li><span data-i18n="rceBypass.tip4Prefix">目标：执行</span> <code>id</code> <span data-i18n="rceBypass.tip4Suffix">命令，让输出包含 uid=</span></li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        const i18n = {
            'zh-CN': {
                'rceBypass.title': '过滤绕过 - 日志查看器',
                'rceBypass.flagPlaceholder': '输入 Flag...',
                'rceBypass.submit': '提交',
                'rceBypass.sectionTitle': '受限日志查看器',
                'rceBypass.scenarioDesc': '管理员只允许使用 ls 和 cat 查看 /tmp/madx-app-logs/ 目录下的日志文件。后端实施了严格的白名单校验。',
                'rceBypass.allowedLabel': '允许的命令:',
                'rceBypass.allowedPathLabel': '允许的路径:',
                'rceBypass.blockedLabel': '过滤的字符:',
                'rceBypass.cmdPlaceholder': '输入命令...',
                'rceBypass.execBtn': '执行',
                'rceBypass.waitingOutput': '等待执行...',
                'rceBypass.tips': '提示',
                'rceBypass.tip1': '白名单过滤了所有常见的命令分隔符...真的全部了吗？',
                'rceBypass.tip2': '不是所有分隔符都是"可见字符"',
                'rceBypass.tip3': '试试在合法命令之后做点"换行"的事情',
                'rceBypass.tip4Prefix': '目标：执行',
                'rceBypass.tip4Suffix': '命令，让输出包含 uid=',
                'rceBypass.enterCmd': '请输入命令',
                'rceBypass.executing': '执行中...',
                'rceBypass.congrats': '恭喜！过滤绕过关卡完成！',
                'rceBypass.enterFlag': '请输入 Flag',
                'rceBypass.flagError': 'Flag 不正确',
                'rceBypass.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'rceBypass.title': 'Filter Bypass - Log Viewer',
                'rceBypass.flagPlaceholder': 'Enter Flag...',
                'rceBypass.submit': 'Submit',
                'rceBypass.sectionTitle': 'Restricted Log Viewer',
                'rceBypass.scenarioDesc': 'Admin only allows using ls and cat to view files in /tmp/madx-app-logs/. The backend enforces strict whitelist validation.',
                'rceBypass.allowedLabel': 'Allowed Commands:',
                'rceBypass.allowedPathLabel': 'Allowed Path:',
                'rceBypass.blockedLabel': 'Blocked Characters:',
                'rceBypass.cmdPlaceholder': 'Enter command...',
                'rceBypass.execBtn': 'Execute',
                'rceBypass.waitingOutput': 'Waiting for execution...',
                'rceBypass.tips': 'Tips',
                'rceBypass.tip1': 'All common command separators are filtered... are they really ALL blocked?',
                'rceBypass.tip2': 'Not all separators are "visible characters"',
                'rceBypass.tip3': 'Try doing something with "line breaks" after a valid command',
                'rceBypass.tip4Prefix': 'Goal: execute the',
                'rceBypass.tip4Suffix': 'command to get output containing uid=',
                'rceBypass.enterCmd': 'Please enter a command',
                'rceBypass.executing': 'Executing...',
                'rceBypass.congrats': 'Congratulations! Filter bypass challenge completed!',
                'rceBypass.enterFlag': 'Please enter Flag',
                'rceBypass.flagError': 'Incorrect flag',
                'rceBypass.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        function setExample(cmd) {
            document.getElementById('command-input').value = cmd;
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=rce&vul_level=level3');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level3', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'rce', level: 'level3', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('exec-btn').addEventListener('click', handleExecute);
            document.getElementById('command-input').addEventListener('keydown', e => {
                if (e.key === 'Enter' && e.ctrlKey) handleExecute();
            });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function handleExecute() {
            const command = document.getElementById('command-input').value;
            const feedbackEl = document.getElementById('feedback');
            const outputEl = document.getElementById('output-content');
            const execBtn = document.getElementById('exec-btn');

            if (!command.trim()) {
                feedbackEl.className = 'feedback error';
                feedbackEl.textContent = t('rceBypass.enterCmd');
                return;
            }

            execBtn.disabled = true;
            execBtn.textContent = t('rceBypass.executing');
            outputEl.className = 'waiting';
            outputEl.textContent = t('rceBypass.executing');
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';

            try {
                const response = await fetch('/api/challenge/rce/bypass/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: command })
                });
                const result = await response.json();

                outputEl.className = '';
                outputEl.textContent = result.output || 'No output';

                if (result.flag) {
                    feedbackEl.className = 'feedback success';
                    feedbackEl.textContent = 'Bypass Success! Flag: ' + result.flag;
                } else if (result.bypass_hint) {
                    feedbackEl.className = 'feedback success';
                    feedbackEl.textContent = result.hint;
                } else if (result.blocked) {
                    feedbackEl.className = 'feedback error';
                    feedbackEl.textContent = result.message || 'Command blocked';
                }
            } catch (error) {
                outputEl.className = 'error-output';
                outputEl.textContent = t('rceBypass.networkError');
                feedbackEl.className = 'feedback error';
                feedbackEl.textContent = t('rceBypass.networkError');
            } finally {
                execBtn.disabled = false;
                execBtn.textContent = t('rceBypass.execBtn');
            }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!flag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('rceBypass.enterFlag');
                return;
            }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level3', flag: flag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('rceBypass.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'rce', level: 'level3' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('rceBypass.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('rceBypass.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
