<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码注入 - SpEL</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .search-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 700px; margin: 0 auto; }

        .variables-info {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .variables-title {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .variables-list {
            font-size: 0.82rem;
            color: #b0b0b0;
            line-height: 1.8;
        }
        .variables-list code {
            background: rgba(255, 215, 0, 0.1);
            color: #d4af37;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .template-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: var(--spacing-md); }
        .template-label { color: var(--color-text-secondary); font-size: 0.9rem; font-weight: 500; }
        .template-textarea {
            width: 100%;
            min-height: 80px;
            resize: vertical;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 3px;
            padding: 0.75rem 1rem;
            color: var(--color-text-primary);
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }
        .template-textarea:focus { outline: none; border-color: var(--color-gold); }
        .render-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; width: fit-content; }
        .render-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .render-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .search-feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .search-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .search-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .result-container { margin-top: var(--spacing-md); }
        .result-label { font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 8px; font-weight: 500; }
        .rendered-output {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 14px 18px;
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-all;
        }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); margin-top: 0; }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; margin-bottom: 0; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 data-i18n="spelInject.title">代码注入 - SpEL</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="spelInject.flagPlaceholder" placeholder="输入获取到的Flag" autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="spelInject.submitFlag">提交Flag</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="search-container">
            <div class="variables-info">
                <div class="variables-title" data-i18n="spelInject.varsTitle">可用模板变量</div>
                <div class="variables-list">
                    <code>#{name}</code> - <span data-i18n="spelInject.varName">用户姓名 (Alice)</span><br>
                    <code>#{role}</code> - <span data-i18n="spelInject.varRole">用户角色 (普通用户)</span><br>
                    <code>#{joinDate}</code> - <span data-i18n="spelInject.varDate">注册日期 (2024-01-15)</span>
                </div>
            </div>

            <div class="template-form">
                <label class="template-label" data-i18n="spelInject.label">消息模板</label>
                <textarea id="template-input" class="template-textarea" data-i18n-placeholder="spelInject.placeholder" placeholder="输入消息模板，如: 欢迎回来, #{name}!">欢迎回来, #{name}! 你的角色是 #{role}</textarea>
                <button id="render-btn" class="render-btn">
                    <span>⚡</span>
                    <span data-i18n="spelInject.renderBtn">生成消息</span>
                </button>
            </div>
            <div id="search-feedback" class="search-feedback"></div>
            <div id="result-container" class="result-container" style="display: none;">
                <div class="result-label" data-i18n="spelInject.resultLabel">渲染结果</div>
                <div id="rendered-output" class="rendered-output"></div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="spelInject.tips">提示</h3>
            <ul>
                <li data-i18n="spelInject.tip1">模板引擎很贴心，会帮你算出表达式的值...但它到底能算多少？</li>
                <li data-i18n="spelInject.tip2">Java的类库就像一座宝藏，关键是你知不知道门在哪里</li>
                <li data-i18n="spelInject.tip3">有些变量是预设的，但谁说你只能用预设的？</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentFlag = null;

        const i18n = {
            'zh-CN': {
                'spelInject.title': '代码注入 - SpEL',
                'spelInject.varsTitle': '可用模板变量',
                'spelInject.varName': '用户姓名 (Alice)',
                'spelInject.varRole': '用户角色 (普通用户)',
                'spelInject.varDate': '注册日期 (2024-01-15)',
                'spelInject.label': '消息模板',
                'spelInject.placeholder': '输入消息模板，如: 欢迎回来, #{name}!',
                'spelInject.renderBtn': '生成消息',
                'spelInject.resultLabel': '渲染结果',
                'spelInject.renderSuccess': '模板渲染成功',
                'spelInject.injectionDetected': '检测到SpEL表达式注入！',
                'spelInject.tip1': '模板引擎很贴心，会帮你算出表达式的值...但它到底能算多少？',
                'spelInject.tip2': 'Java的类库就像一座宝藏，关键是你知不知道门在哪里',
                'spelInject.tip3': '有些变量是预设的，但谁说你只能用预设的？',
                'spelInject.flagLabel': 'Flag',
                'spelInject.flagPlaceholder': '输入获取到的Flag',
                'spelInject.submitFlag': '提交Flag',
                'spelInject.tips': '提示',
                'spelInject.congrats': '恭喜！SpEL代码注入关卡完成！',
                'spelInject.enterFlag': '请输入 Flag',
                'spelInject.flagError': 'Flag 不正确',
                'spelInject.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'spelInject.title': 'Code Injection - SpEL',
                'spelInject.varsTitle': 'Available Template Variables',
                'spelInject.varName': 'Username (Alice)',
                'spelInject.varRole': 'User Role (Regular User)',
                'spelInject.varDate': 'Join Date (2024-01-15)',
                'spelInject.label': 'Message Template',
                'spelInject.placeholder': 'Enter message template, e.g.: Welcome back, #{name}!',
                'spelInject.renderBtn': 'Render',
                'spelInject.resultLabel': 'Rendered Result',
                'spelInject.renderSuccess': 'Template rendered successfully',
                'spelInject.injectionDetected': 'SpEL expression injection detected!',
                'spelInject.tip1': 'The template engine kindly evaluates expressions... but how far can it go?',
                'spelInject.tip2': 'Java\'s class library is like a treasure trove - the key is knowing where the door is',
                'spelInject.tip3': 'Some variables are preset, but who says you can only use those?',
                'spelInject.flagLabel': 'Flag',
                'spelInject.flagPlaceholder': 'Enter the Flag you obtained',
                'spelInject.submitFlag': 'Submit Flag',
                'spelInject.tips': 'Tips',
                'spelInject.congrats': 'Congratulations! SpEL Code Injection completed!',
                'spelInject.enterFlag': 'Please enter Flag',
                'spelInject.flagError': 'Incorrect flag',
                'spelInject.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        function getAuthHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) { headers['Authorization'] = 'Bearer ' + token; }
            return headers;
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            handleRender();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch(getApiUrl('/challenge/status_get?vul_type=rce&vul_level=level2'), {
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { /* status check failed silently */ }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch(getApiUrl('/challenge/status_update'), {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level2', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'rce', level: 'level2', status: status }, '*');
                }
            } catch (error) { /* status update failed silently */ }
        }

        function bindEvents() {
            document.getElementById('render-btn').addEventListener('click', handleRender);
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function handleRender() {
            const template = document.getElementById('template-input').value;
            const feedbackEl = document.getElementById('search-feedback');

            feedbackEl.textContent = '';
            feedbackEl.className = 'search-feedback';

            try {
                const response = await fetch(getApiUrl('/challenge/rce/spel/render'), {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ template: template })
                });
                const result = await response.json();

                const container = document.getElementById('result-container');
                const output = document.getElementById('rendered-output');
                container.style.display = 'block';
                output.textContent = result.rendered || '';

                if (result.injection_detected && result.flag) {
                    feedbackEl.textContent = t('spelInject.injectionDetected') + ' Flag: ' + result.flag;
                    feedbackEl.className = 'search-feedback success';
                    currentFlag = result.flag;
                } else {
                    feedbackEl.textContent = t('spelInject.renderSuccess');
                    feedbackEl.className = 'search-feedback success';
                }
            } catch (error) {
                feedbackEl.className = 'search-feedback error';
                feedbackEl.textContent = t('spelInject.networkError');
            }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');

            if (!submittedFlag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('spelInject.enterFlag');
                return;
            }

            try {
                const response = await fetch(getApiUrl('/challenge/flag_check'), {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ vul_type: 'rce', vul_level: 'level2', flag: submittedFlag })
                });
                const result = await response.json();

                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('spelInject.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'rce', level: 'level2' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('spelInject.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('spelInject.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
