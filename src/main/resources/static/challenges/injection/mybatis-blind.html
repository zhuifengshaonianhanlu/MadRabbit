<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL注入 - 盲注</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .search-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
        .search-form { display: flex; gap: 8px; align-items: center; margin-bottom: var(--spacing-md); }
        .search-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; }
        .search-input:focus { outline: none; border-color: var(--color-gold); }
        .search-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .search-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .search-feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .search-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .search-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .sql-preview { margin-top: var(--spacing-sm); padding: var(--spacing-xs); background: rgba(0, 0, 0, 0.3); border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--color-text-secondary); word-break: break-all; }
        .sql-preview span { color: var(--color-gold-light); }
        .sql-toggle {
            cursor: pointer;
            margin-left: 8px;
            color: var(--color-text-secondary);
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .sql-toggle:hover {
            opacity: 1;
            color: var(--color-gold-light);
        }

        .result-container { margin-top: var(--spacing-md); }
        .result-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
        }
        .result-status.exists {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        .result-status.not-exists {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .result-icon {
            font-size: 1.3rem;
        }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); margin-top: 0; }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; margin-bottom: 0; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 data-i18n="mybatisBlind.title">SQL注入-盲注</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="mybatisBlind.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="search-container">
            <div class="search-form">
                <label for="search-input" data-i18n="mybatisBlind.label" style="color: var(--color-text-secondary); white-space: nowrap;">用户姓名</label>
                <input type="text" id="search-input" class="search-input" placeholder="输入用户姓名..." autocomplete="off" />
                <button id="search-btn" class="search-btn">
                    <span>🔍</span>
                    <span data-i18n="mybatisBlind.searchBtn">搜索</span>
                </button>
            </div>
            <div id="search-feedback" class="search-feedback"></div>
            <div id="sql-preview" class="sql-preview" style="display: none;">
                <span>SQL:</span>
                <span id="sql-query-masked">*************************</span>
                <span id="sql-query" style="display: none;"></span>
                <span id="sql-toggle" class="sql-toggle" title="显示/隐藏SQL">
                    <svg id="eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                    <svg id="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </span>
            </div>
            <div id="result-container" class="result-container" style="display: none;">
                <div id="result-status" class="result-status">
                    <!-- JS动态填充 -->
                </div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="mybatisBlind.tips">提示</h3>
            <ul>
                <li data-i18n="mybatisBlind.tip1">这次搜索变得沉默寡言了，只会告诉你"有"或"没有"</li>
                <li data-i18n="mybatisBlind.tip2">看不到数据？试试当一个"是非题"高手</li>
                <li data-i18n="mybatisBlind.tip3">时间也是一种语言，沉默有时候比回答更有信息量</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentFlag = null;
        const sqlQueryMasked = document.getElementById('sql-query-masked');
        const sqlToggle = document.getElementById('sql-toggle');
        const eyeClosed = document.getElementById('eye-closed');
        const eyeOpen = document.getElementById('eye-open');
        let sqlVisible = false;

        const i18n = {
            'zh-CN': {
                'mybatisBlind.title': 'SQL注入-盲注',
                'mybatisBlind.submit': '提交',
                'mybatisBlind.searchBtn': '搜索',
                'mybatisBlind.label': '用户姓名',
                'mybatisBlind.tips': '提示',
                'mybatisBlind.tip1': '这次搜索变得沉默寡言了，只会告诉你"有"或"没有"',
                'mybatisBlind.tip2': '看不到数据？试试当一个"是非题"高手',
                'mybatisBlind.tip3': '时间也是一种语言，沉默有时候比回答更有信息量',
                'mybatisBlind.congrats': '恭喜！SQL盲注关卡完成！',
                'mybatisBlind.enterFlag': '请输入 Flag',
                'mybatisBlind.flagError': 'Flag 不正确',
                'mybatisBlind.networkError': '网络错误，请稍后再试',
                'mybatisBlind.userExists': '用户存在',
                'mybatisBlind.userNotExists': '用户不存在'
            },
            'en-US': {
                'mybatisBlind.title': 'SQL Injection - Blind',
                'mybatisBlind.submit': 'Submit',
                'mybatisBlind.searchBtn': 'Search',
                'mybatisBlind.label': 'Username',
                'mybatisBlind.tips': 'Tips',
                'mybatisBlind.tip1': 'The search has gone quiet - it only says "yes" or "no"',
                'mybatisBlind.tip2': 'Can\'t see the data? Try being a "true or false" master',
                'mybatisBlind.tip3': 'Time is also a language - silence sometimes says more than answers',
                'mybatisBlind.congrats': 'Congratulations! SQL Blind Injection completed!',
                'mybatisBlind.enterFlag': 'Please enter Flag',
                'mybatisBlind.flagError': 'Incorrect flag',
                'mybatisBlind.networkError': 'Network error, please try again later',
                'mybatisBlind.userExists': 'User exists',
                'mybatisBlind.userNotExists': 'User does not exist'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        function getAuthHeaders() {
            const token = getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) { headers['Authorization'] = 'Bearer ' + token; }
            return headers;
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            loadInitialData();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch(getApiUrl('/challenge/status_get?vul_type=injection&vul_level=level9'), {
                    headers: getAuthHeaders()
                });
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { /* status check failed silently */ }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch(getApiUrl('/challenge/status_update'), {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ vul_type: 'injection', vul_level: 'level9', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'injection', level: 'level9', status: status }, '*');
                }
            } catch (error) { /* status update failed silently */ }
        }

        function bindEvents() {
            document.getElementById('search-btn').addEventListener('click', handleSearch);
            document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSearch(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
            sqlToggle.addEventListener('click', function() {
                sqlVisible = !sqlVisible;
                if (sqlVisible) {
                    sqlQueryMasked.style.display = 'none';
                    document.getElementById('sql-query').style.display = 'inline';
                    eyeClosed.style.display = 'none';
                    eyeOpen.style.display = 'inline';
                } else {
                    sqlQueryMasked.style.display = 'inline';
                    document.getElementById('sql-query').style.display = 'none';
                    eyeClosed.style.display = 'inline';
                    eyeOpen.style.display = 'none';
                }
            });
        }

        async function loadInitialData() {
            document.getElementById('search-input').value = 'Alice';
            await handleSearch();
        }

        async function handleSearch() {
            const name = document.getElementById('search-input').value;
            const feedbackEl = document.getElementById('search-feedback');
            const sqlPreview = document.getElementById('sql-preview');
            const sqlQuery = document.getElementById('sql-query');

            feedbackEl.textContent = '';
            feedbackEl.className = 'search-feedback';

            try {
                const response = await fetch(getApiUrl('/challenge/injection/mybatis/blind?name=' + encodeURIComponent(name)), {
                    headers: getAuthHeaders()
                });
                const result = await response.json();

                if (result.sql) {
                    sqlPreview.style.display = 'block';
                    sqlQuery.textContent = result.sql;
                    sqlVisible = false;
                    sqlQueryMasked.style.display = 'inline';
                    sqlQuery.style.display = 'none';
                    eyeClosed.style.display = 'inline';
                    eyeOpen.style.display = 'none';
                }

                const container = document.getElementById('result-container');
                const status = document.getElementById('result-status');
                container.style.display = 'block';

                if (result.exists) {
                    status.className = 'result-status exists';
                    status.innerHTML = '<span class="result-icon">✓</span><span data-i18n="mybatisBlind.userExists">' + t('mybatisBlind.userExists') + '</span>';
                } else {
                    status.className = 'result-status not-exists';
                    status.innerHTML = '<span class="result-icon">✗</span><span data-i18n="mybatisBlind.userNotExists">' + t('mybatisBlind.userNotExists') + '</span>';
                }

                if (result.injection_detected && result.flag) {
                    currentFlag = result.flag;
                    feedbackEl.className = 'search-feedback success';
                    feedbackEl.textContent = result.message + ' Flag: ' + result.flag;
                }
            } catch (error) {
                feedbackEl.className = 'search-feedback error';
                feedbackEl.textContent = t('mybatisBlind.networkError');
            }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');

            if (!submittedFlag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('mybatisBlind.enterFlag');
                return;
            }

            try {
                const response = await fetch(getApiUrl('/challenge/flag_check'), {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ vul_type: 'injection', vul_level: 'level9', flag: submittedFlag })
                });
                const result = await response.json();

                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('mybatisBlind.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'injection', level: 'level9' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('mybatisBlind.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('mybatisBlind.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
