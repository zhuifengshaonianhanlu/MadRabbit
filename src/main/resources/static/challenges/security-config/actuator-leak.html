<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actuator Endpoint Exposure</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .main-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
        .section-title { color: var(--color-gold); font-size: 1rem; margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-xs); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }

        .health-status { display: flex; align-items: center; gap: 10px; margin-bottom: var(--spacing-md); padding: var(--spacing-sm); background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.25); border-radius: 4px; }
        .health-dot { width: 12px; height: 12px; background: var(--color-success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .health-text { color: var(--color-success); font-weight: 600; }

        .endpoint-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--spacing-md); }
        .endpoint-btn { background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); padding: 8px 14px; border-radius: 3px; font-size: 0.85rem; color: var(--color-gold-light); cursor: pointer; font-family: 'Courier New', monospace; }
        .endpoint-btn:hover { background: rgba(212, 175, 55, 0.2); }
        .endpoint-btn.active { background: rgba(212, 175, 55, 0.3); border-color: var(--color-gold); }

        .url-bar { background: rgba(0, 0, 0, 0.3); padding: var(--spacing-sm); border-radius: 4px; margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: 8px; }
        .url-method { padding: 4px 8px; border-radius: 3px; font-weight: bold; font-size: 0.8rem; background: rgba(34, 197, 94, 0.2); color: var(--color-success); }
        .url-path { color: var(--color-gold-light); font-family: 'Courier New', monospace; font-size: 0.9rem; }

        .action-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.85rem; min-height: 1.2em; }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }

        .response-display { margin-top: var(--spacing-md); }
        .response-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 4px; padding: var(--spacing-md); min-height: 200px; max-height: 400px; overflow-y: auto; }
        .response-box pre { margin: 0; font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--color-text-primary); white-space: pre-wrap; word-break: break-all; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="actuator.title">系统健康监控面板</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="actuator.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="actuator.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="main-container">
            <h3 class="section-title" data-i18n="actuator.monitorTitle">Spring Boot 应用监控</h3>

            <div class="health-status">
                <div class="health-dot"></div>
                <span class="health-text" data-i18n="actuator.healthUp">服务状态: UP</span>
            </div>

            <p style="color: var(--color-text-secondary); margin-bottom: var(--spacing-md); font-size: 0.9rem;" data-i18n="actuator.healthDesc">健康检查通过，所有组件正常运行。你能找到其他可访问的监控端点吗？</p>

            <div class="endpoint-list">
                <span class="endpoint-btn active" onclick="setEndpoint(this, 'health')">/health</span>
                <span class="endpoint-btn" onclick="setEndpoint(this, 'mappings')">/mappings</span>
                <span class="endpoint-btn" onclick="setEndpoint(this, 'beans')">/beans</span>
            </div>

            <div class="url-bar">
                <span class="url-method">GET</span>
                <span id="url-path" class="url-path">/actuator/health</span>
            </div>

            <button id="send-btn" class="action-btn" data-i18n="actuator.sendBtn">发送请求</button>
            <div id="feedback" class="feedback"></div>

            <div class="response-display">
                <div class="response-box">
                    <pre id="response-content" data-i18n="actuator.waiting">等待请求...</pre>
                </div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="actuator.tips">提示</h3>
            <ul>
                <li data-i18n="actuator.tip1">这是一个基于 Spring Boot 框架的应用</li>
                <li data-i18n="actuator.tip2">Spring Boot Actuator 提供了多种监控端点</li>
                <li data-i18n="actuator.tip3">某些端点可能暴露敏感的配置信息和环境变量</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentEndpoint = 'health';
        const BASE_PATH = '/actuator/';
        const i18n = {
            'zh-CN': {
                'actuator.title': '系统健康监控面板',
                'actuator.flagPlaceholder': '输入 Flag...',
                'actuator.submit': '提交',
                'actuator.monitorTitle': 'Spring Boot 应用监控',
                'actuator.healthUp': '服务状态: UP',
                'actuator.healthDesc': '健康检查通过，所有组件正常运行。你能找到其他可访问的监控端点吗？',
                'actuator.sendBtn': '发送请求',
                'actuator.waiting': '等待请求...',
                'actuator.tips': '提示',
                'actuator.tip1': '这是一个基于 Spring Boot 框架的应用',
                'actuator.tip2': 'Spring Boot Actuator 提供了多种监控端点',
                'actuator.tip3': '某些端点可能暴露敏感的配置信息和环境变量',
                'actuator.sending': '请求中...',
                'actuator.congrats': '恭喜！Actuator 端点暴露关卡完成！',
                'actuator.enterFlag': '请输入 Flag',
                'actuator.flagError': 'Flag 不正确',
                'actuator.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'actuator.title': 'System Health Monitor',
                'actuator.flagPlaceholder': 'Enter Flag...',
                'actuator.submit': 'Submit',
                'actuator.monitorTitle': 'Spring Boot Application Monitor',
                'actuator.healthUp': 'Service Status: UP',
                'actuator.healthDesc': 'Health check passed, all components running normally. Can you find other accessible monitoring endpoints?',
                'actuator.sendBtn': 'Send Request',
                'actuator.waiting': 'Waiting for request...',
                'actuator.tips': 'Tips',
                'actuator.tip1': 'This is a Spring Boot framework application',
                'actuator.tip2': 'Spring Boot Actuator provides various monitoring endpoints',
                'actuator.tip3': 'Some endpoints may expose sensitive configuration and environment variables',
                'actuator.sending': 'Sending...',
                'actuator.congrats': 'Congratulations! Actuator endpoint exposure challenge completed!',
                'actuator.enterFlag': 'Please enter Flag',
                'actuator.flagError': 'Incorrect flag',
                'actuator.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        function setEndpoint(el, endpoint) {
            currentEndpoint = endpoint;
            document.getElementById('url-path').textContent = BASE_PATH + endpoint;
            document.querySelectorAll('.endpoint-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=security-config&vul_level=level1');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'security-config', vul_level: 'level1', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'security-config', level: 'level1', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('send-btn').addEventListener('click', handleSend);
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function handleSend() {
            const feedbackEl = document.getElementById('feedback');
            const responseEl = document.getElementById('response-content');
            const sendBtn = document.getElementById('send-btn');

            sendBtn.disabled = true;
            sendBtn.textContent = t('actuator.sending');
            responseEl.textContent = t('actuator.sending');
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';

            try {
                const response = await fetch(BASE_PATH + currentEndpoint);
                const result = await response.json();
                responseEl.textContent = JSON.stringify(result, null, 2);

                if (currentEndpoint === 'env') {
                    const jsonStr = JSON.stringify(result);
                    const flagMatch = jsonStr.match(/flag\{[^}]+\}/);
                    if (flagMatch) {
                        feedbackEl.className = 'feedback success';
                        feedbackEl.textContent = 'Sensitive Config Found! Flag: ' + flagMatch[0];
                    }
                }
            } catch (error) {
                responseEl.textContent = t('actuator.networkError');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = t('actuator.sendBtn');
            }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!flag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('actuator.enterFlag');
                return;
            }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'security-config', vul_level: 'level1', flag: flag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('actuator.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'security-config', level: 'level1' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('actuator.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('actuator.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
