<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSRF Redirect Bypass</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .url-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        .url-form { display: flex; gap: 8px; align-items: center; margin-bottom: var(--spacing-md); }
        .url-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; }
        .url-input:focus { outline: none; border-color: var(--color-gold); }
        .url-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .url-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .url-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .url-feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .url-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .url-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }
        .url-feedback.warning { background: rgba(255, 149, 0, 0.15); color: #ff9500; border: 1px solid rgba(255, 149, 0, 0.25); }

        .preview-results { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.2); border-radius: 4px; min-height: 100px; }
        .preview-header { font-size: 0.95rem; color: var(--color-text-secondary); margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-sm); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .preview-content { font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--color-text-primary); white-space: pre-wrap; word-break: break-all; }
        .no-preview { color: var(--color-text-secondary); text-align: center; padding: var(--spacing-md); }

        .dns-info { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: rgba(212, 175, 55, 0.08); border-radius: 3px; font-size: 0.8rem; color: var(--color-text-secondary); font-family: 'Courier New', monospace; }
        .dns-info .label { color: var(--color-gold); }
        .dns-info .pass { color: var(--color-success); }
        .dns-info .blocked { color: var(--color-danger); }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
        @media (max-width: 768px) { .flag-input-inline { width: 140px; } .url-form { flex-direction: column; } .url-btn { width: 100%; justify-content: center; } }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="ssrfRedirect.title">可恶的重定向</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="ssrfRedirect.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="ssrfRedirect.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="url-container">
            <div class="url-form">
                <input type="text" id="domain-input" class="url-input" data-i18n-placeholder="ssrfRedirect.domainPlaceholder" placeholder="输入URL，如 http://example.com" autocomplete="off" />
                <button id="detect-btn" class="url-btn">
                    <span>🔍</span>
                    <span data-i18n="ssrfRedirect.detectBtn">检测</span>
                </button>
            </div>
            <div id="url-feedback" class="url-feedback"></div>
            <div id="dns-info" class="dns-info" style="display:none;"></div>

            <div id="preview-results" class="preview-results">
                <div class="no-preview" data-i18n="ssrfRedirect.initialHint">输入URL进行安全检测</div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="ssrfRedirect.tips">提示</h3>
            <ul>
                <li data-i18n="ssrfRedirect.tip1">DNS检查只在第一次请求前进行，重定向后的目标不会再次检查</li>
                <li data-i18n="ssrfRedirect.tip2">让你的域名指向一个外网服务器，但这个服务器会"指路"到别处</li>
                <li data-i18n="ssrfRedirect.tip3">HTTP 302/301 就像一个路标，服务器会无条件跟着走</li>
                <li><span data-i18n="ssrfRedirect.tip4Prefix">服务器内网藏着一个秘密接口：</span> <code>http://127.0.0.1:8080/api/challenge/ssrf/redirect/secret-info</code></li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        let currentFlag = null;

        const urlRegex = /^https?:\/\/([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}(\/[^\s]*)?$/;

        const i18n = {
            'zh-CN': {
                'ssrfRedirect.title': '可恶的重定向',
                'ssrfRedirect.flagPlaceholder': '输入 Flag...',
                'ssrfRedirect.submit': '提交',
                'ssrfRedirect.domainPlaceholder': '输入URL，如 http://example.com',
                'ssrfRedirect.detectBtn': '检测',
                'ssrfRedirect.tips': '提示',
                'ssrfRedirect.tip1': 'DNS检查只在第一次请求前进行，重定向后的目标不会再次检查',
                'ssrfRedirect.tip2': '让你的域名指向一个外网服务器，但这个服务器会"指路"到别处',
                'ssrfRedirect.tip3': 'HTTP 302/301 就像一个路标，服务器会无条件跟着走',
                'ssrfRedirect.tip4Prefix': '服务器内网藏着一个秘密接口：',
                'ssrfRedirect.initialHint': '输入URL进行安全检测',
                'ssrfRedirect.enterDomain': '请输入URL',
                'ssrfRedirect.invalidDomain': '无效的URL格式，需要以 http:// 或 https:// 开头，不支持IP地址',
                'ssrfRedirect.detecting': '检测中...',
                'ssrfRedirect.congrats': '恭喜！重定向绕过关卡完成！',
                'ssrfRedirect.enterFlag': '请输入 Flag',
                'ssrfRedirect.flagError': 'Flag 不正确',
                'ssrfRedirect.networkError': '网络错误，请稍后再试',
                'ssrfRedirect.dnsResolved': 'DNS解析',
                'ssrfRedirect.ipCheck': 'IP检查'
            },
            'en-US': {
                'ssrfRedirect.title': 'Evil Redirect',
                'ssrfRedirect.flagPlaceholder': 'Enter Flag...',
                'ssrfRedirect.submit': 'Submit',
                'ssrfRedirect.domainPlaceholder': 'Enter URL, e.g. http://example.com',
                'ssrfRedirect.detectBtn': 'Detect',
                'ssrfRedirect.tips': 'Tips',
                'ssrfRedirect.tip1': 'DNS check only happens before the first request; redirect targets are not re-checked',
                'ssrfRedirect.tip2': 'Point your domain to an external server, but that server will "redirect" elsewhere',
                'ssrfRedirect.tip3': 'HTTP 302/301 is like a road sign - the server follows it unconditionally',
                'ssrfRedirect.tip4Prefix': 'A secret endpoint hides on the internal network:',
                'ssrfRedirect.initialHint': 'Enter a URL for security detection',
                'ssrfRedirect.enterDomain': 'Please enter a URL',
                'ssrfRedirect.invalidDomain': 'Invalid URL format. Must start with http:// or https://, no IP addresses allowed',
                'ssrfRedirect.detecting': 'Detecting...',
                'ssrfRedirect.congrats': 'Congratulations! Redirect bypass challenge completed!',
                'ssrfRedirect.enterFlag': 'Please enter Flag',
                'ssrfRedirect.flagError': 'Incorrect flag',
                'ssrfRedirect.networkError': 'Network error, please try again later',
                'ssrfRedirect.dnsResolved': 'DNS Resolved',
                'ssrfRedirect.ipCheck': 'IP Check'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }
        function showFeedback(element, type, message) { element.className = 'url-feedback ' + type; element.textContent = message; }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') { localStorage.setItem('lang', event.data.language); applyLanguage(); }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key]; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key]; });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=ssrf&vul_level=level4');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vul_type: 'ssrf', vul_level: 'level4', status: status }) });
                if (window.parent !== window) { window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'ssrf', level: 'level4', status: status }, '*'); }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('detect-btn').addEventListener('click', handleDetect);
            document.getElementById('domain-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleDetect(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function handleDetect() {
            const domain = document.getElementById('domain-input').value.trim();
            const feedbackEl = document.getElementById('url-feedback');
            const dnsInfoEl = document.getElementById('dns-info');
            const detectBtn = document.getElementById('detect-btn');

            if (!domain) { showFeedback(feedbackEl, 'error', t('ssrfRedirect.enterDomain')); return; }

            // 前端URL格式校验
            if (!urlRegex.test(domain)) { showFeedback(feedbackEl, 'error', t('ssrfRedirect.invalidDomain')); return; }

            detectBtn.disabled = true;
            const originalText = detectBtn.querySelector('[data-i18n="ssrfRedirect.detectBtn"]').textContent;
            detectBtn.querySelector('[data-i18n="ssrfRedirect.detectBtn"]').textContent = t('ssrfRedirect.detecting');
            feedbackEl.textContent = ''; feedbackEl.className = 'url-feedback';
            dnsInfoEl.style.display = 'none';

            try {
                const response = await fetch('/api/challenge/ssrf/redirect/detect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domain: domain }) });
                const result = await response.json();

                const resultsDiv = document.getElementById('preview-results');

                // 显示DNS解析信息
                if (result.resolved_ip) {
                    const checkClass = result.ip_check === 'pass' ? 'pass' : 'blocked';
                    const checkText = result.ip_check === 'pass' ? 'PASS' : 'BLOCKED';
                    dnsInfoEl.innerHTML = '<span class="label">' + t('ssrfRedirect.dnsResolved') + ':</span> ' + result.domain + ' → ' + result.resolved_ip + ' | <span class="label">' + t('ssrfRedirect.ipCheck') + ':</span> <span class="' + checkClass + '">' + checkText + '</span>';
                    dnsInfoEl.style.display = 'block';
                }

                if (result.success) {
                    resultsDiv.innerHTML = '<div class="preview-header"></div><div class="preview-content"></div>';
                    resultsDiv.querySelector('.preview-header').textContent = result.message;
                    resultsDiv.querySelector('.preview-content').textContent = result.content || '';

                    if (result.flag) {
                        currentFlag = result.flag;
                        showFeedback(feedbackEl, 'success', 'SSRF Redirect Bypass Detected! Flag: ' + result.flag);
                    }
                } else if (result.blocked) {
                    resultsDiv.innerHTML = '<div class="no-preview">' + result.message + '</div>';
                    showFeedback(feedbackEl, 'warning', result.message);
                } else {
                    showFeedback(feedbackEl, 'error', result.message || t('ssrfRedirect.networkError'));
                }
            } catch (error) { showFeedback(feedbackEl, 'error', t('ssrfRedirect.networkError')); }
            finally { detectBtn.disabled = false; detectBtn.querySelector('[data-i18n="ssrfRedirect.detectBtn"]').textContent = originalText; }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');

            if (!submittedFlag) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('ssrfRedirect.enterFlag'); return; }

            try {
                const response = await fetch('/api/challenge/flag_check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vul_type: 'ssrf', vul_level: 'level4', flag: submittedFlag }) });
                const result = await response.json();

                if (result.success) {
                    flagMessage.className = 'flag-message-inline success'; flagMessage.textContent = t('ssrfRedirect.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) { window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'ssrf', level: 'level4' }, '*'); }
                } else { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = result.message || t('ssrfRedirect.flagError'); }
            } catch (error) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('ssrfRedirect.networkError'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
