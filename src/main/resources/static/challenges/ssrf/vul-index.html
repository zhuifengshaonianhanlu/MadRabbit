<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSRF 服务器端请求伪造 - 关卡挑战</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        /* ====================================
           CSS Variables & Reset
           ==================================== */
        :root {
            --color-bg-dark: #0a0a0a;
            --color-bg-deep: #050505;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-bronze: #cd7f32;
            --color-success: #22c55e;
            --color-warning: #ff9500;
            --color-danger: #ff2a2a;
            
            --font-display: "Georgia", "Times New Roman", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }

        /* ====================================
           Navigation Bar (从 index.html 复制)
           ==================================== */
        .navbar {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding: var(--spacing-md) var(--spacing-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            display: inline-block;
            vertical-align: middle;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 600;
            color: var(--color-text-primary);
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* ====================================
           Layout Styles
           ==================================== */
        body {
            margin: 0;
            padding: 0;
            background: var(--color-bg-dark);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ====================================
           Sidebar - 关卡列表
           ==================================== */
        .sidebar {
            width: 320px;
            background: rgba(10, 10, 10, 0.95);
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: var(--spacing-lg);
            padding-left: var(--spacing-md);
            padding-right: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--color-gold);
            margin-bottom: var(--spacing-xs);
        }

        .sidebar-subtitle {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .challenge-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .challenge-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 6px;
            padding: var(--spacing-md);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: var(--spacing-sm);
            position: relative;
        }

        .challenge-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(212, 175, 55, 0.05);
        }

        .challenge-item.active {
            border-color: var(--color-gold);
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .challenge-item.completed {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .challenge-item.in-progress {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .challenge-item.not-started {
            cursor: pointer;
        }

        .challenge-item-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
        }

        .challenge-item-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .challenge-item.completed .challenge-item-icon {
            color: var(--color-success);
        }

        .challenge-item.in-progress .challenge-item-icon {
            color: var(--color-gold);
        }

        .challenge-item.not-started .challenge-item-icon {
            color: var(--color-text-secondary);
        }

        .challenge-item-title {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .challenge-item-status {
            position: absolute;
            right: var(--spacing-md);
            bottom: var(--spacing-sm);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            z-index: 1;
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: var(--color-success);
        }

        .status-in-progress {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-bg-dark);
        }

        .status-not-started {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-secondary);
        }

        .challenge-item-desc {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: var(--spacing-xs);
            padding-right: 70px;
        }

        /* ====================================
           Main Content - 关卡详情
           ==================================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 顶部区域 - 漏洞分类标题 + 进度条 */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .vuln-type-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        .breadcrumb a {
            color: var(--color-gold);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .breadcrumb a:hover {
            color: var(--color-gold-light);
        }

        .breadcrumb-separator {
            color: var(--color-text-secondary);
            opacity: 0.6;
        }

        .vuln-type-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .vuln-type-icon {
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.3));
        }

        .vuln-type-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        /* 进度条容器 */
        .progress-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 6px;
            padding: var(--spacing-xs) var(--spacing-lg);
            min-width: 640px;
            position: relative;
            overflow: hidden;
        }

        .progress-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
        }

        .progress-bar-wrapper {
            position: relative;
        }

        .progress-track {
            height: 10px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, 
                rgba(212, 175, 55, 0.8) 0%, 
                var(--color-gold) 50%, 
                rgba(244, 207, 87, 1.2) 100%);
            border-radius: 5px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-glow {
            position: absolute;
            top: -1px;
            right: -2px;
            width: 5px;
            height: 12px;
            background: radial-gradient(ellipse, rgba(244, 207, 87, 1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(2px);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .content-body {
            flex: 1;
            display: flex;
            padding-left: var(--spacing-lg);
            padding-right: var(--spacing-lg);
            padding-top: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            gap: var(--spacing-md);
            overflow: hidden;
            min-height: 0;
        }

        /* 左侧关卡列表容器 */
        .challenges-panel {
            width: 320px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        /* 右侧内容区域 */
        .content-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            overflow: hidden;
            min-height: 0;
        }

        .development-message {
            font-size: 2rem;
            color: var(--color-text-secondary);
            text-align: center;
        }

        /* ====================================
           Flag Submit Form Styles (内联布局)
           ==================================== */
        .header-section {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, transparent, var(--color-gold), transparent) 1;
            padding: var(--spacing-sm) 0;
            margin-bottom: var(--spacing-md);
        }

        .header-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--spacing-lg);
        }

        .header-title-row h1 {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flag-submit-form {
            display: flex;
            gap: var(--spacing-xs);
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .flag-input-inline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            padding: var(--spacing-xs) var(--spacing-sm);
            color: var(--color-text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            width: 180px;
            transition: all 0.3s ease;
        }

        .flag-input-inline:focus {
            outline: none;
            border-color: var(--color-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .flag-submit-btn-small {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-bg-dark);
            border: none;
            border-radius: 4px;
            padding: var(--spacing-xs) var(--spacing-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .flag-submit-btn-small:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4);
        }

        .flag-message-inline {
            font-size: 0.8rem;
            margin-left: var(--spacing-xs);
            min-height: 1.2em;
        }

        .flag-message-inline.success {
            color: var(--color-success);
        }

        .flag-message-inline.error {
            color: var(--color-danger);
        }

        /* ====================================
           Level 1 Challenge Styles
           ==================================== */
        .level1-content h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--color-gold);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
        }

        .login-form-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            padding: var(--spacing-lg);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-gold);
        }

        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            padding: var(--spacing-sm);
            color: var(--color-text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-bg-dark);
            border: none;
            border-radius: 4px;
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: var(--spacing-sm);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-feedback {
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm);
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5em;
        }

        .login-feedback.success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--color-success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .login-feedback.error {
            background: rgba(255, 42, 42, 0.2);
            color: var(--color-danger);
            border: 1px solid rgba(255, 42, 42, 0.3);
        }

        .content-display {
            width: 100%;
            flex: 1;
            padding: 0;
            overflow: hidden;
            background: rgba(10, 10, 10, 0.9);
            border-radius: 6px;
            min-height: 0;
        }
        
        .content-display.with-padding {
            padding: var(--spacing-lg);
            overflow-y: auto;
        }

        .content-display h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--color-gold);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
        }

        .content-display h2 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--color-gold-light);
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .content-display h3 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
        }

        .content-display p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .content-display strong {
            color: var(--color-gold);
            font-weight: 600;
        }

        .content-display code {
            background: rgba(212, 175, 55, 0.1);
            color: var(--color-gold-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .content-display pre {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
            overflow-x: auto;
        }

        .content-display pre code {
            background: none;
            color: var(--color-text-primary);
            padding: 0;
            font-size: 0.85rem;
        }

        .content-display ul, .content-display ol {
            margin-left: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
        }

        .content-display li {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--color-text-primary);
            margin-bottom: 6px;
        }

        .content-display li::marker {
            color: var(--color-gold);
        }

        .content-display a {
            color: var(--color-gold);
            text-decoration: none;
            transition: color 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .content-display a:hover {
            color: var(--color-gold-light);
            border-bottom-color: var(--color-gold-light);
        }

        .content-display hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            margin: var(--spacing-lg) 0;
        }

        .content-display blockquote {
            background: rgba(212, 175, 55, 0.05);
            border-left: 3px solid var(--color-gold);
            padding: var(--spacing-sm) var(--spacing-md);
            margin: var(--spacing-sm) 0;
            font-style: italic;
            color: var(--color-text-secondary);
        }

        .content-display table {
            width: 100%;
            border-collapse: collapse;
            margin: var(--spacing-sm) 0;
        }

        .content-display th, .content-display td {
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: var(--spacing-xs) var(--spacing-sm);
            text-align: left;
        }

        .content-display th {
            background: rgba(212, 175, 55, 0.1);
            color: var(--color-gold);
            font-weight: 600;
        }

        /* 加载状态 */
        .loading-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--color-text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: var(--color-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: var(--spacing-sm);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Level0 完成提示浮框 */
        .level0-complete-toast {
            position: fixed;
            bottom: 80px;
            right: 40px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.95), rgba(22, 163, 74, 0.95));
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4);
            z-index: 1000;
            animation: toastSlideIn 0.5s ease-out, toastPulse 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            font-weight: 500;
        }

        .level0-complete-toast i {
            font-size: 1.5rem;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 8px 48px rgba(34, 197, 94, 0.6); }
        }

        /* Level0 完成按钮样式 */
        .level0-complete-section {
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
        }

        .level0-complete-btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-bg-dark);
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .level0-complete-btn:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);

        // 应用国际化翻译
        function applyI18n() {
            const lang = getCurrentLang();
            
            // 查找所有带有 data-i18n 属性的元素
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (i18nTranslations[lang] && i18nTranslations[lang][key]) {
                    element.textContent = i18nTranslations[lang][key];
                }
            });
        }

        // 初始化
        function init() {
            // 确保 DOM 完全加载后再获取元素
            challengeItems = document.querySelectorAll('.challenge-item');

            bindEvents();
            updateProgress();
            applyI18n();  // 应用国际化
            // 默认选中第0关
            selectChallenge('level0');

            // 监听语言切换事件
            window.addEventListener('languageChanged', function(event) {
                applyI18n();  // 重新应用国际化
                
                // 如果当前是第0关或第4关，重新加载 markdown 内容
                if (currentChallenge === 'level0' || currentChallenge === 'level5') {
                    displayChallengeContent(currentChallenge);
                }
                
                // 向 iframe 发送语言切换消息
                const iframe1 = document.getElementById('level1-iframe');
                if (iframe1 && iframe1.contentWindow) {
                    iframe1.contentWindow.postMessage({
                        type: 'languageChanged',
                        language: event.detail.language
                    }, '*');
                }
                
                const iframe2 = document.getElementById('level2-iframe');
                if (iframe2 && iframe2.contentWindow) {
                    iframe2.contentWindow.postMessage({
                        type: 'languageChanged',
                        language: event.detail.language
                    }, '*');
                }
                
                const iframe3 = document.getElementById('level3-iframe');
                if (iframe3 && iframe3.contentWindow) {
                    iframe3.contentWindow.postMessage({
                        type: 'languageChanged',
                        language: event.detail.language
                    }, '*');
                }

                const iframe4 = document.getElementById('level4-iframe');
                if (iframe4 && iframe4.contentWindow) {
                    iframe4.contentWindow.postMessage({
                        type: 'languageChanged',
                        language: event.detail.language
                    }, '*');
                }
            });
            
            // 监听来自 iframe 的消息（关卡状态变化通知）
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'challengeCompleted') {
                    // 刷新进度
                    fetchAndUpdateProgress();
                }
                if (event.data && event.data.type === 'challengeStatusChanged') {
                    // 刷新进度和关卡列表状态
                    fetchAndUpdateProgress();
                }
            });
        }

        // 绑定事件
        function bindEvents() {
            
            // 关卡项目点击事件 - 所有关卡都可以无门槛进入
            challengeItems.forEach((item, index) => {
                const challengeId = item.dataset.challenge;
                
                item.addEventListener('click', function(event) {
                    event.preventDefault(); // 阻止默认行为
                    const clickedChallengeId = this.dataset.challenge;
                    
                    // 直接选择关卡，无需检查锁定状态
                    selectChallenge(clickedChallengeId);
                });
            });
        }
            
        // 选择关卡 - 只添加选中效果，不修改关卡状态
        function selectChallenge(challengeId) {
            
            // 1. 清除所有关卡的选中效果（active类），但不修改状态
            challengeItems.forEach(item => {
                item.classList.remove('active');
            });
            
            // 2. 设置当前关卡为选中效果
            const selectedItem = document.querySelector(`[data-challenge="${challengeId}"]`);
            if (selectedItem) {
                selectedItem.classList.add('active');
            }
            
            // 3. 更新当前关卡变量
            currentChallenge = challengeId;
        
            // 4. 显示关卡内容
            displayChallengeContent(challengeId);
        }
        
        // 获取原始图标样式（用于还原）
        function getOriginalIconClass(challengeId) {
            const iconMap = {
                'level0': 'fas fa-book-open',
                'level1': 'fas fa-eye',
                'level2': 'fas fa-plug',
                'level3': 'fas fa-filter',
                'level4': 'fas fa-random',
                'level5': 'fas fa-flag-checkered'
            };
            return iconMap[challengeId] || 'fas fa-question';
        }

        // 显示关卡内容
        async function displayChallengeContent(challengeId) {
        
            const contentDisplay = document.getElementById('content-display');
            if (!contentDisplay) {
                console.error('找不到 content-display 元素');
                return;
            }
        
            if (challengeId === 'level0') {
                // "获取秘籍"显示实际的 markdown 内容
                contentDisplay.classList.add('with-padding');
                
                // 检查并更新关卡状态为"进行中"
                checkAndUpdateLevel0Status();
                
                const lang = getCurrentLang();
                        
                // 显示加载动画
                contentDisplay.innerHTML = `
                    <div class="loading-message">
                        <div class="loading-spinner"></div>
                        <div>${lang === 'zh-CN' ? '加载中...' : 'Loading...'}</div>
                    </div>
                `;
        
                try {
                    // 获取当前语言对应的 markdown 文件
                    const markdownPath = lang === 'zh-CN' ? '/knowledge/ssrf/ssrf_zh_CN.md' : '/knowledge/ssrf/ssrf_en_US.md';
        
                    const response = await fetch(markdownPath);
        
                    if (!response.ok) {
                        throw new Error('Failed to load markdown file');
                    }
        
                    const markdownContent = await response.text();
        
                    // 等待 marked.js 加载完成
                    let checkCount = 0;
                    while (typeof marked === 'undefined' && checkCount < 50) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        checkCount++;
                    }
                            
                    if (typeof marked === 'undefined') {
                        console.error('marked.js 未加载，等待超时');
                        throw new Error('marked.js is not loaded after waiting');
                    }
        
                    const htmlContent = marked.parse(markdownContent);
        
                    // 添加完成按钮
                    const completeBtnHtml = `
                        <div class="level0-complete-section">
                            <button id="level0-complete-btn" class="level0-complete-btn">
                                <i class="fas fa-check-circle"></i>
                                <span>${lang === 'zh-CN' ? '我已经掌握' : 'I GET IT'}</span>
                            </button>
                        </div>
                    `;
                    
                    contentDisplay.innerHTML = htmlContent + completeBtnHtml;
                    
                    // 绑定按钮点击事件
                    setupLevel0CompleteButton();
                } catch (error) {
                    console.error('加载 markdown 错误:', error);
                    const errorLang = getCurrentLang();
                    const markedStatus = typeof marked !== 'undefined' ? 'loaded' : 'not loaded';
                    contentDisplay.innerHTML = `
                        <div class="development-message">
                            <div style="color: var(--color-danger); margin-bottom: var(--spacing-sm);">
                                <i class="fas fa-exclamation-circle"></i> ${errorLang === 'zh-CN' ? '加载失败' : 'Failed to Load'}
                            </div>
                            <div style="font-size: 1rem; color: var(--color-text-secondary);">
                                ${errorLang === 'zh-CN' ? '无法加载学习资料，请稍后重试' : 'Unable to load learning materials, please try again later'}
                            </div>
                            <div style="font-size: 0.8rem; color: var(--color-text-secondary); margin-top: 10px;">
                                ${errorLang === 'zh-CN' ? '错误详情:' : 'Error:'} ${error.message}
                            </div>
                            <div style="font-size: 0.7rem; color: var(--color-bronze); margin-top: 5px;">
                                marked.js 状态：${markedStatus}
                            </div>
                        </div>
                    `;
                }
            } else if (challengeId === 'level1') {
                // 第一关：基础SSRF - 加载独立关卡页面
                contentDisplay.classList.remove('with-padding');
                checkAndUpdateLevelStatus('level1');
                contentDisplay.innerHTML = `
                    <iframe 
                        src="/challenges/ssrf/ssrf-basic.html" 
                        style="width: 100%; height: 100%; border: none; background: transparent;"
                        frameborder="0"
                        id="level1-iframe"
                    ></iframe>
                `;
                            
                // 监听 iframe 加载完成，延迟刷新进度（等待 iframe 内的状态更新完成）
                const iframe = document.getElementById('level1-iframe');
                if (iframe) {
                    iframe.addEventListener('load', function() {
                        // 延迟 500ms 等待 iframe 内的状态更新完成
                        setTimeout(() => {
                            fetchAndUpdateProgress();
                        }, 500);
                    });
                }
            } else if (challengeId === 'level2') {
                // 第二关：协议利用 - 加载独立关卡页面
                contentDisplay.classList.remove('with-padding');
                checkAndUpdateLevelStatus('level2');
                contentDisplay.innerHTML = `
                    <iframe 
                        src="/challenges/ssrf/ssrf-protocol.html" 
                        style="width: 100%; height: 100%; border: none; background: transparent;"
                        frameborder="0"
                        id="level2-iframe"
                    ></iframe>
                `;
                            
                // 监听 iframe 加载完成，延迟刷新进度（等待 iframe 内的状态更新完成）
                const iframe = document.getElementById('level2-iframe');
                if (iframe) {
                    iframe.addEventListener('load', function() {
                        // 延迟 500ms 等待 iframe 内的状态更新完成
                        setTimeout(() => {
                            fetchAndUpdateProgress();
                        }, 500);
                    });
                }
            } else if (challengeId === 'level3') {
                // 第三关：过滤绕过 - 加载独立关卡页面
                contentDisplay.classList.remove('with-padding');
                checkAndUpdateLevelStatus('level3');
                contentDisplay.innerHTML = `
                    <iframe 
                        src="/challenges/ssrf/ssrf-bypass.html" 
                        style="width: 100%; height: 100%; border: none; background: transparent;"
                        frameborder="0"
                        id="level3-iframe"
                    ></iframe>
                `;
                            
                // 监听 iframe 加载完成，延迟刷新进度（等待 iframe 内的状态更新完成）
                const iframe = document.getElementById('level3-iframe');
                if (iframe) {
                    iframe.addEventListener('load', function() {
                        // 延迟 500ms 等待 iframe 内的状态更新完成
                        setTimeout(() => {
                            fetchAndUpdateProgress();
                        }, 500);
                    });
                }
            } else if (challengeId === 'level4') {
                // 第四关：重定向绕过 - 加载独立关卡页面
                contentDisplay.classList.remove('with-padding');
                checkAndUpdateLevelStatus('level4');
                contentDisplay.innerHTML = `
                    <iframe
                        src="/challenges/ssrf/ssrf-redirect.html"
                        style="width: 100%; height: 100%; border: none; background: transparent;"
                        frameborder="0"
                        id="level4-iframe"
                    ></iframe>
                `;

                // 监听 iframe 加载完成，延迟刷新进度（等待 iframe 内的状态更新完成）
                const iframe = document.getElementById('level4-iframe');
                if (iframe) {
                    iframe.addEventListener('load', function() {
                        // 延迟 500ms 等待 iframe 内的状态更新完成
                        setTimeout(() => {
                            fetchAndUpdateProgress();
                        }, 500);
                    });
                }
            } else if (challengeId === 'level5') {
                // 第五关：终结 - 显示总结 markdown 内容
                contentDisplay.classList.add('with-padding');

                // 检查并更新关卡状态为"进行中"
                checkAndUpdateLevel5Status();
                
                const lang = getCurrentLang();
                        
                // 显示加载动画
                contentDisplay.innerHTML = `
                    <div class="loading-message">
                        <div class="loading-spinner"></div>
                        <div>${lang === 'zh-CN' ? '加载中...' : 'Loading...'}</div>
                    </div>
                `;
        
                try {
                    // 获取当前语言对应的 markdown 文件
                    const markdownPath = lang === 'zh-CN' ? '/knowledge/ssrf/ssrf_finale_zh_CN.md' : '/knowledge/ssrf/ssrf_finale_en_US.md';
        
                    const response = await fetch(markdownPath);
        
                    if (!response.ok) {
                        throw new Error('Failed to load markdown file');
                    }
        
                    const markdownContent = await response.text();
        
                    // 等待 marked.js 加载完成
                    let checkCount = 0;
                    while (typeof marked === 'undefined' && checkCount < 50) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        checkCount++;
                    }
                            
                    if (typeof marked === 'undefined') {
                        console.error('marked.js 未加载，等待超时');
                        throw new Error('marked.js is not loaded after waiting');
                    }
        
                    const htmlContent = marked.parse(markdownContent);
        
                    // 添加完成按钮
                    const completeBtnHtml = `
                        <div class="level0-complete-section">
                            <button id="level5-complete-btn" class="level0-complete-btn">
                                <i class="fas fa-flag-checkered"></i>
                                <span>${lang === 'zh-CN' ? '出关' : 'Complete'}</span>
                            </button>
                        </div>
                    `;

                    contentDisplay.innerHTML = htmlContent + completeBtnHtml;

                    // 绑定按钮点击事件
                    setupLevel5CompleteButton();
                } catch (error) {
                    console.error('加载终结关卡 markdown 错误:', error);
                    const errorLang = getCurrentLang();
                    const markedStatus = typeof marked !== 'undefined' ? 'loaded' : 'not loaded';
                    contentDisplay.innerHTML = `
                        <div class="development-message">
                            <div style="color: var(--color-danger); margin-bottom: var(--spacing-sm);">
                                <i class="fas fa-exclamation-circle"></i> ${errorLang === 'zh-CN' ? '加载失败' : 'Failed to Load'}
                            </div>
                            <div style="font-size: 1rem; color: var(--color-text-secondary);">
                                ${errorLang === 'zh-CN' ? '无法加载学习资料，请稍后重试' : 'Unable to load learning materials, please try again later'}
                            </div>
                            <div style="font-size: 0.8rem; color: var(--color-text-secondary); margin-top: 10px;">
                                ${errorLang === 'zh-CN' ? '错误详情:' : 'Error:'} ${error.message}
                            </div>
                            <div style="font-size: 0.7rem; color: var(--color-bronze); margin-top: 5px;">
                                marked.js 状态：${markedStatus}
                            </div>
                        </div>
                    `;
                }
            } else {
                // 其他关卡显示开发中消息
                contentDisplay.classList.add('with-padding');
                const devLang = getCurrentLang();
                        
                contentDisplay.innerHTML = `
                    <div class="development-message">
                        <div style="font-size: 2rem; color: var(--color-gold); margin-bottom: var(--spacing-md);">
                            <i class="fas fa-tools"></i>
                        </div>
                        <div style="font-size: 1.5rem; color: var(--color-text-primary); margin-bottom: var(--spacing-sm);">
                            ${devLang === 'zh-CN' ? '页面正在开发中' : 'Page Under Development'}
                        </div>
                        <div style="font-size: 1rem; color: var(--color-text-secondary);">
                            ${devLang === 'zh-CN' ? '该关卡正在开发中，敬请期待' : 'This level is under development, stay tuned'}
                        </div>
                    </div>
                `;
            }
                    
        }

        // 更新关卡选择状态 - 暂时不做状态切换，等待后端接口
        function updateChallengeSelection() {
            // TODO: 后续会根据后端接口来提供状态信息
            // 目前保持初始状态不变
        }
    
        // 从后端获取进度数据并更新进度条
        async function fetchAndUpdateProgress() {
            
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const response = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/progress_get?vul_type=ssrf`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    // 更新进度条
                    updateProgressBar(data.completedCount, data.totalCount, data.progressPercent);
                    
                    // 更新关卡列表状态
                    updateChallengeListStatus(data.challenges);
                }
                
            } catch (error) {
                console.error('获取进度数据失败:', error);
                // 失败时使用默认值
                updateProgressBar(0, 5, 0);
            }
        }
        
        // 更新进度条显示
        function updateProgressBar(completedCount, totalCount, progressPercent) {
            
            const progressBar = document.getElementById('progress-bar');
            const completedCountEl = document.getElementById('completed-count');
            const totalCountEl = document.getElementById('total-count');
            
            if (progressBar) {
                progressBar.style.width = `${progressPercent}%`;
            }
            
            if (completedCountEl) {
                completedCountEl.textContent = completedCount;
            }
            
            if (totalCountEl) {
                totalCountEl.textContent = totalCount;
            }
        }
        
        // 更新关卡列表状态
        function updateChallengeListStatus(challenges) {
            if (!challenges || challenges.length === 0) {
                return;
            }
            
            
            challenges.forEach(challenge => {
                // 后端返回的字段是 vul_level
                const levelId = challenge.vul_level;
                const status = challenge.status;
                
                const challengeItem = document.querySelector(`[data-challenge="${levelId}"]`);
                if (!challengeItem) {
                    return;
                }
                
                // 移除所有状态类
                challengeItem.classList.remove('completed', 'in-progress', 'not-started');
                
                // 更新状态图标
                const iconContainer = challengeItem.querySelector('.challenge-item-icon i');
                const statusEl = challengeItem.querySelector('.challenge-item-status');
                
                const lang = getCurrentLang();
                
                // 后端返回的状态是中文：已完成、进行中、未开始
                if (status === '已完成') {
                    challengeItem.classList.add('completed');
                    if (iconContainer) {
                        iconContainer.className = 'fas fa-check-circle';
                        iconContainer.style.color = 'var(--color-success)';
                        iconContainer.style.filter = 'drop-shadow(0 0 6px rgba(34, 197, 94, 0.6))';
                    }
                    if (statusEl) {
                        statusEl.className = 'challenge-item-status status-completed';
                        statusEl.setAttribute('data-i18n', 'common.completed');
                        statusEl.textContent = lang === 'zh-CN' ? '已完成' : 'Completed';
                    }
                } else if (status === '进行中') {
                    challengeItem.classList.add('in-progress');
                    if (iconContainer) {
                        const originalIconClass = getOriginalIconClass(levelId);
                        iconContainer.className = originalIconClass;
                        iconContainer.style.color = 'var(--color-gold)';
                        iconContainer.style.filter = 'drop-shadow(0 0 6px rgba(212, 175, 55, 0.6))';
                    }
                    if (statusEl) {
                        statusEl.className = 'challenge-item-status status-in-progress';
                        statusEl.setAttribute('data-i18n', 'common.inProgress');
                        statusEl.textContent = lang === 'zh-CN' ? '进行中' : 'In Progress';
                    }
                } else {
                    challengeItem.classList.add('not-started');
                    if (iconContainer) {
                        const originalIconClass = getOriginalIconClass(levelId);
                        iconContainer.className = originalIconClass;
                        iconContainer.style.color = '';
                        iconContainer.style.filter = '';
                    }
                    if (statusEl) {
                        statusEl.className = 'challenge-item-status status-not-started';
                        statusEl.setAttribute('data-i18n', 'common.notStarted');
                        statusEl.textContent = lang === 'zh-CN' ? '未开始' : 'Not Started';
                    }
                }
            });
        }
        
        // 检查并更新 Level0 状态为"进行中"
        async function checkAndUpdateLevel0Status() {
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const statusResponse = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_get?vul_type=ssrf&vul_level=level0`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const statusResult = await statusResponse.json();
                
                // 如果状态是"未开始"，则更新为"进行中"
                if (statusResult.status === '未开始') {
                    await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_update`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            vul_type: 'ssrf',
                            vul_level: 'level0',
                            status: '进行中'
                        })
                    });
                    // 刷新进度
                    fetchAndUpdateProgress();
                }
            } catch (e) {
                console.error('更新 Level0 状态失败:', e);
            }
        }
        
        // 检查并更新 Level5 状态为"进行中"
        async function checkAndUpdateLevel5Status() {
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const statusResponse = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_get?vul_type=ssrf&vul_level=level5`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const statusResult = await statusResponse.json();

                // 如果状态是"未开始"，则更新为"进行中"
                if (statusResult.status === '未开始') {
                    await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_update`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            vul_type: 'ssrf',
                            vul_level: 'level5',
                            status: '进行中'
                        })
                    });
                    // 刷新进度
                    fetchAndUpdateProgress();
                }
            } catch (e) {
                console.error('更新 Level5 状态失败:', e);
            }
        }
        
        // 检查并更新 Level1/2/3 状态为"进行中"
        async function checkAndUpdateLevelStatus(vulLevel) {
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const statusResponse = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_get?vul_type=ssrf&vul_level=${vulLevel}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!statusResponse.ok) return;
                const result = await statusResponse.json();
                if (result.status && result.status !== '进行中' && result.status !== 'In Progress' && result.status !== '已完成' && result.status !== 'Completed') {
                    await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_update`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            vul_type: 'ssrf',
                            vul_level: vulLevel,
                            status: '进行中'
                        })
                    });
                    fetchAndUpdateProgress();
                }
            } catch (error) {
                console.error(`更新${vulLevel}状态出错:`, error);
            }
        }
        
        // Level0 完成按钮处理
        let level0Completed = false; // 防止重复触发
        
        async function setupLevel0CompleteButton() {
            const btn = document.getElementById('level0-complete-btn');
            if (!btn) {
                console.error('找不到完成按钮');
                return;
            }
            
            // 检查当前关卡状态，如果已完成则隐藏按钮
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const statusResponse = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_get?vul_type=ssrf&vul_level=level0`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const statusResult = await statusResponse.json();
                
                if (statusResult.status === '已完成') {
                    btn.parentElement.style.display = 'none';
                    return;
                }
            } catch (e) {
                // 检查状态失败，继续设置按钮
            }
            
            // 重置完成标志
            level0Completed = false;
            
            // 绑定点击事件
            btn.addEventListener('click', async function handleClick() {
                if (level0Completed) return;
                
                level0Completed = true;
                btn.disabled = true;
                
                const lang = getCurrentLang();
                btn.innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>${lang === 'zh-CN' ? '提交中...' : 'Submitting...'}</span>
                `;
                
                await markLevel0AsCompleted();
                
                // 更新按钮状态
                btn.innerHTML = `
                    <i class="fas fa-check"></i>
                    <span>${lang === 'zh-CN' ? '已完成' : 'Completed'}</span>
                `;
            });
        }
        
        // 标记 Level0 为已完成
        async function markLevel0AsCompleted() {
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const response = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        vul_type: 'ssrf',
                        vul_level: 'level0',
                        status: '已完成'
                    })
                });
                
                const result = await response.json();
                
                if (result.success === true) {
                    // 刷新进度条和关卡列表状态
                    await fetchAndUpdateProgress();
                    // 显示提示浮框
                    showLevel0CompleteToast();
                }
            } catch (error) {
                console.error('更新 Level0 状态失败:', error);
            }
        }
        
        // 显示 Level0 完成提示浮框
        function showLevel0CompleteToast() {
            const lang = getCurrentLang();
            const message = lang === 'zh-CN' ? '看来你已经入门了！' : 'You have mastered the basics!';
            
            // 创建浮框元素
            const toast = document.createElement('div');
            toast.className = 'level0-complete-toast';
            toast.innerHTML = `
                <i class="fas fa-trophy"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            // 5秒后自动消失
            setTimeout(() => {
                toast.style.animation = 'toastSlideIn 0.5s ease-out reverse';
                setTimeout(() => {
                    toast.remove();
                }, 500);
            }, 5000);
        }
        
        // Level5 完成按钮处理
        let level5Completed = false; // 防止重复触发

        async function setupLevel5CompleteButton() {
            const btn = document.getElementById('level5-complete-btn');
            if (!btn) {
                console.error('找不到出关按钮');
                return;
            }

            // 检查当前关卡状态，如果已完成则隐藏按钮
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const statusResponse = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_get?vul_type=ssrf&vul_level=level5`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const statusResult = await statusResponse.json();

                if (statusResult.status === '已完成') {
                    btn.parentElement.style.display = 'none';
                    return;
                }
            } catch (e) {
                // 检查状态失败，继续设置按钮
            }

            // 重置完成标志
            level5Completed = false;

            // 绑定点击事件
            btn.addEventListener('click', async function handleClick() {
                if (level5Completed) return;

                level5Completed = true;
                btn.disabled = true;

                const lang = getCurrentLang();
                btn.innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>${lang === 'zh-CN' ? '提交中...' : 'Submitting...'}</span>
                `;

                await markLevel5AsCompleted();

                // 更新按钮状态
                btn.innerHTML = `
                    <i class="fas fa-check"></i>
                    <span>${lang === 'zh-CN' ? '已出关' : 'Completed'}</span>
                `;
            });
        }

        // 标记 Level5 为已完成
        async function markLevel5AsCompleted() {
            try {
                const token = localStorage.getItem(APP_CONFIG.TOKEN_KEY);
                const response = await fetch(`${API_CONFIG.API_BASE_URL}/challenge/status_update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        vul_type: 'ssrf',
                        vul_level: 'level5',
                        status: '已完成'
                    })
                });

                const result = await response.json();

                if (result.success === true) {
                    // 刷新进度条和关卡列表状态
                    await fetchAndUpdateProgress();
                    // 显示提示浮框
                    showLevel5CompleteToast();
                }
            } catch (error) {
                console.error('更新 Level5 状态失败:', error);
            }
        }

        // 显示 Level5 完成提示浮框
        function showLevel5CompleteToast() {
            const lang = getCurrentLang();
            const message = lang === 'zh-CN' ? '恭喜你通关了SSRF服务端请求伪造！' : 'Congratulations! You\'ve completed SSRF Server-Side Request Forgery!';
            
            // 创建浮框元素
            const toast = document.createElement('div');
            toast.className = 'level0-complete-toast';
            toast.innerHTML = `
                <i class="fas fa-graduation-cap"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            
            // 5秒后自动消失
            setTimeout(() => {
                toast.style.animation = 'toastSlideIn 0.5s ease-out reverse';
                setTimeout(() => {
                    toast.remove();
                }, 500);
            }, 5000);
        }
        
        // 更新进度（兼容旧代码）
        function updateProgress() {
            // 调用新的异步函数
            fetchAndUpdateProgress();
        }
    
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
