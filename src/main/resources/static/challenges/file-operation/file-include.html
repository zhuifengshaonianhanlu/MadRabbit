<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Inclusion Vulnerability</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root { --color-bg-dark: #0a0a0a; --color-text-primary: #f5f5f5; --color-text-secondary: #9a9a9a; --color-gold: #d4af37; --color-gold-light: #f4cf57; --color-gold-dark: #b4941f; --color-success: #22c55e; --color-danger: #ff2a2a; --font-display: "Georgia", serif; --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; --spacing-xs: 0.5rem; --spacing-sm: 1rem; --spacing-md: 1.5rem; --spacing-lg: 2rem; --spacing-xl: 3rem; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .challenge-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
        .info-box { background: rgba(212, 175, 55, 0.1); border-left: 3px solid var(--color-gold); padding: var(--spacing-sm); margin-bottom: var(--spacing-md); border-radius: 4px; }
        .info-box p { margin: 0; color: var(--color-text-secondary); font-size: 0.9rem; }
        .info-box strong { color: var(--color-gold); }

        .template-list { margin-bottom: var(--spacing-md); }
        .template-list-header { font-size: 0.9rem; color: var(--color-gold); margin-bottom: var(--spacing-sm); }
        .template-item { display: inline-block; padding: 8px 16px; background: rgba(255, 255, 255, 0.03); border-radius: 4px; margin-right: 8px; margin-bottom: 8px; border: 1px solid rgba(212, 175, 55, 0.2); cursor: pointer; transition: all 0.2s; font-family: monospace; font-size: 0.9rem; }
        .template-item:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--color-gold); }
        .template-item.active { background: rgba(212, 175, 55, 0.2); border-color: var(--color-gold); }

        .input-group { display: flex; gap: 8px; align-items: center; margin-bottom: var(--spacing-md); }
        .template-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 3px; padding: 0.75rem 1rem; color: var(--color-text-primary); font-size: 0.95rem; font-family: monospace; }
        .template-input:focus { outline: none; border-color: var(--color-gold); }
        .action-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 3px; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .feedback { margin-top: 0.5rem; padding: 0.5rem; border-radius: 3px; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }
        .feedback.warning { background: rgba(255, 149, 0, 0.15); color: #ff9500; border: 1px solid rgba(255, 149, 0, 0.25); }

        .result-area { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.3); border-radius: 4px; min-height: 150px; }
        .result-header { font-size: 0.95rem; color: var(--color-gold); margin-bottom: var(--spacing-sm); }
        .result-content { font-family: monospace; font-size: 0.85rem; color: var(--color-text-primary); white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: var(--spacing-sm); border-radius: 4px; word-break: break-all; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 data-i18n="include.title">文件包含 - 本地文件包含</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="challenge-container">
            <div class="info-box">
                <p><strong data-i18n="include.scenario">场景：</strong><span data-i18n="include.scenarioDesc">文档查看器，可加载系统预置的页面模板。</span></p>
            </div>

            <div class="template-list">
                <div class="template-list-header" data-i18n="include.templateList">可用模板</div>
                <span class="template-item" onclick="setTemplate('home.html')">home.html</span>
                <span class="template-item" onclick="setTemplate('about.html')">about.html</span>
                <span class="template-item" onclick="setTemplate('contact.html')">contact.html</span>
            </div>

            <div class="input-group">
                <input type="text" id="template-input" class="template-input" placeholder="输入模板路径..." value="home.html" />
                <button id="load-btn" class="action-btn" data-i18n="include.loadBtn">加载</button>
            </div>
            <div id="feedback" class="feedback"></div>

            <div id="result-area" class="result-area">
                <div class="result-header" data-i18n="include.resultHeader">文件内容</div>
                <div id="result-content" class="result-content" data-i18n="include.initialHint">选择或输入模板名称加载</div>
            </div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="include.tips">提示</h3>
            <ul>
                <li data-i18n="include.tip1">模板文件存储在服务器的某个目录下</li>
                <li data-i18n="include.tip2">如果能读取到其他目录的文件就好了……</li>
                <li data-i18n="include.tip3">某些过滤可能不够彻底</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        const i18n = {
            'zh-CN': { 'include.title': '文件包含 - 本地文件包含', 'include.scenario': '场景：', 'include.scenarioDesc': '文档查看器，可加载系统预置的页面模板。', 'include.templateList': '可用模板', 'include.loadBtn': '加载', 'include.resultHeader': '文件内容', 'include.initialHint': '选择或输入模板名称加载', 'include.tips': '提示', 'include.tip1': '模板文件存储在服务器的某个目录下', 'include.tip2': '如果能读取到其他目录的文件就好了……', 'include.tip3': '某些过滤可能不够彻底', 'include.congrats': '恭喜！文件包含关卡完成！', 'include.enterFlag': '请输入 Flag', 'include.flagError': 'Flag 不正确', 'include.networkError': '网络错误' },
            'en-US': { 'include.title': 'File Inclusion - Local File Inclusion', 'include.scenario': 'Scenario:', 'include.scenarioDesc': 'Document viewer that loads pre-configured page templates.', 'include.templateList': 'Available Templates', 'include.loadBtn': 'Load', 'include.resultHeader': 'File Content', 'include.initialHint': 'Select or enter template name to load', 'include.tips': 'Tips', 'include.tip1': 'Template files are stored in a directory on the server', 'include.tip2': 'What if you could read files from other directories...', 'include.tip3': 'Some filters may not be thorough enough', 'include.congrats': 'Congratulations! File inclusion challenge completed!', 'include.enterFlag': 'Please enter Flag', 'include.flagError': 'Incorrect flag', 'include.networkError': 'Network error' }
        };
        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }
        function showFeedback(el, type, msg) { el.className = 'feedback ' + type; el.textContent = msg; }
        function setTemplate(name) {
            document.getElementById('template-input').value = name;
            document.querySelectorAll('.template-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('message', function(e) { if (e.data && e.data.type === 'languageChanged') { localStorage.setItem('lang', e.data.language); applyLanguage(); } });
        }

        function applyLanguage() {
            const lang = getLang();
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key]; });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const res = await fetch('/api/challenge/status_get?vul_type=file-operation&vul_level=level3');
                const data = await res.json();
                if (data.status === '未开始') await updateChallengeStatus('进行中');
            } catch (e) {}
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vul_type: 'file-operation', vul_level: 'level3', status: status }) });
                if (window.parent !== window) window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'file-operation', level: 'level3', status: status }, '*');
            } catch (e) {}
        }

        function bindEvents() {
            document.getElementById('load-btn').addEventListener('click', handleLoad);
            document.getElementById('template-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleLoad(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function handleLoad() {
            const template = document.getElementById('template-input').value.trim();
            const feedbackEl = document.getElementById('feedback');
            const resultContent = document.getElementById('result-content');
            const btn = document.getElementById('load-btn');

            if (!template) { showFeedback(feedbackEl, 'error', '请输入模板名称'); return; }

            btn.disabled = true;
            feedbackEl.className = 'feedback';
            feedbackEl.textContent = '';

            try {
                const res = await fetch('/api/challenge/file-op/include/page?template=' + encodeURIComponent(template));
                const data = await res.json();

                if (data.content) {
                    resultContent.textContent = data.content;
                } else {
                    resultContent.textContent = data.message || '无内容';
                }

                if (data.flag) {
                    showFeedback(feedbackEl, 'success', data.message + ' Flag: ' + data.flag);
                } else if (data.blocked_by) {
                    showFeedback(feedbackEl, 'warning', data.message);
                } else if (!data.success) {
                    showFeedback(feedbackEl, 'error', data.message || '加载失败');
                }
            } catch (e) { showFeedback(feedbackEl, 'error', t('include.networkError')); }
            finally { btn.disabled = false; }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const msg = document.getElementById('flag-message');
            if (!flag) { msg.className = 'flag-message-inline error'; msg.textContent = t('include.enterFlag'); return; }
            try {
                const res = await fetch('/api/challenge/flag_check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vul_type: 'file-operation', vul_level: 'level3', flag: flag }) });
                const data = await res.json();
                if (data.success) { msg.className = 'flag-message-inline success'; msg.textContent = t('include.congrats'); await updateChallengeStatus('已完成'); if (window.parent !== window) window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'file-operation', level: 'level3' }, '*'); }
                else { msg.className = 'flag-message-inline error'; msg.textContent = t('include.flagError'); }
            } catch (e) { msg.className = 'flag-message-inline error'; msg.textContent = t('include.networkError'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
