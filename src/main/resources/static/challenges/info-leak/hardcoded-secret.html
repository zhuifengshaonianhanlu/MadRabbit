<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端硬编码泄露</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <!-- Admin panel v2.0 - migrated to new auth, old config in /js/app.config.js -->
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .main-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 500px; margin: 0 auto; }
        .login-header { text-align: center; margin-bottom: var(--spacing-lg); }
        .login-header h2 { color: var(--color-gold); font-family: var(--font-display); margin-bottom: 4px; }
        .login-header p { color: var(--color-text-secondary); font-size: 0.85rem; }

        .form-group { margin-bottom: var(--spacing-md); }
        .form-group label { display: block; color: var(--color-gold); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 10px 14px; color: var(--color-text-primary); font-size: 0.9rem; }
        .form-input:focus { outline: none; border-color: var(--color-gold); }

        .login-btn { width: 100%; background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: var(--spacing-sm); }
        .login-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }

        .login-feedback { margin-top: var(--spacing-sm); padding: var(--spacing-sm); border-radius: 4px; font-size: 0.85rem; text-align: center; display: none; }
        .login-feedback.success { display: block; background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .login-feedback.error { display: block; background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .hint-box { margin-top: var(--spacing-md); padding: var(--spacing-sm); background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 4px; }
        .hint-box p { margin: 0; color: #60a5fa; font-size: 0.9rem; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="hardcoded.title">前端硬编码泄露</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="hardcoded.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="hardcoded.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="main-container">
            <div class="login-header">
                <h2>SecureAdmin Console</h2>
                <p>Management Panel v2.0.3 - Authorized Personnel Only</p>
            </div>

            <div class="form-group">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" class="form-input" placeholder="Enter username..." autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" class="form-input" placeholder="Enter password..." autocomplete="off" />
            </div>

            <button id="login-btn" class="login-btn" data-i18n="hardcoded.loginBtn">登录</button>
            <div id="login-feedback" class="login-feedback"></div>


        </div>

        <div class="tips-box">
            <h3 data-i18n="hardcoded.tipsTitle">提示</h3>
            <ul>
                <li data-i18n="hardcoded.tip1">一个网页展示给用户的内容，和它实际包含的内容，并不总是一致的</li>
                <li data-i18n="hardcoded.tip2">开发者为了方便调试，有时会在代码中留下"后门"</li>
                <li data-i18n="hardcoded.tip3">不是所有数据都以明文存储，但编码不等于加密</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        /**
         * SecureAdmin Console - Frontend Application
         * Version: 2.0.3
         * Last updated: 2024-03-15
         */

        // Application configuration
        var _appName = "SecureAdmin";
        var _appVersion = "2.0.3";

        // TODO: Remove debug credentials before production deployment
        // const DEBUG_USER = "admin"; const DEBUG_PASS = "S3cur3@dm1n!";

        // Legacy config - base64 encoded for "security"
        var _cfg = "eyJ1c2VyIjoiYWRtaW4iLCJwYXNzIjoiUzNjdXIzQGRtMW4hIn0=";

        // API endpoint configuration
        var _apiBase = "/api/challenge/info-leak/hardcoded";

        const i18n = {
            'zh-CN': {
                'hardcoded.title': '前端硬编码泄露',
                'hardcoded.flagPlaceholder': '输入 Flag...',
                'hardcoded.submit': '提交',
                'hardcoded.loginBtn': '登录',
                'hardcoded.hint': '提示：查看此页面的源代码（Ctrl+U）和 JavaScript 代码，开发者可能在前端代码中留下了凭据。',
                'hardcoded.tipsTitle': '提示',
                'hardcoded.tip1': '一个网页展示给用户的内容，和它实际包含的内容，并不总是一致的',
                'hardcoded.tip2': '开发者为了方便调试，有时会在代码中留下"后门"',
                'hardcoded.tip3': '不是所有数据都以明文存储，但编码不等于加密',
                'hardcoded.congrats': '恭喜！前端硬编码泄露关卡完成！',
                'hardcoded.enterFlag': '请输入 Flag',
                'hardcoded.flagError': 'Flag 不正确',
                'hardcoded.networkError': '网络错误，请稍后再试',
                'hardcoded.loginSuccess': '登录成功！Flag 已显示。',
                'hardcoded.loginFailed': '凭据无效，拒绝访问。',
                'hardcoded.fillFields': '请输入用户名和密码'
            },
            'en-US': {
                'hardcoded.title': 'Hardcoded Secret Leak',
                'hardcoded.flagPlaceholder': 'Enter Flag...',
                'hardcoded.submit': 'Submit',
                'hardcoded.loginBtn': 'Login',
                'hardcoded.hint': 'Tip: View this page\'s source code (Ctrl+U) and JavaScript - developers may have left credentials in frontend code.',
                'hardcoded.tipsTitle': 'Tips',
                'hardcoded.tip1': 'What a page shows to users and what it actually contains are not always the same',
                'hardcoded.tip2': 'Developers sometimes leave "backdoors" in code for debugging convenience',
                'hardcoded.tip3': 'Not all data is stored in plaintext, but encoding is not encryption',
                'hardcoded.congrats': 'Congratulations! Hardcoded secret challenge completed!',
                'hardcoded.enterFlag': 'Please enter Flag',
                'hardcoded.flagError': 'Incorrect flag',
                'hardcoded.networkError': 'Network error, please try again later',
                'hardcoded.loginSuccess': 'Login successful! Flag revealed.',
                'hardcoded.loginFailed': 'Invalid credentials. Access denied.',
                'hardcoded.fillFields': 'Please enter username and password'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=info-leak&vul_level=level2');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'info-leak', vul_level: 'level2', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'info-leak', level: 'level2', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('login-btn').addEventListener('click', doLogin);
            document.getElementById('password-input').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function doLogin() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const feedback = document.getElementById('login-feedback');

            if (!username || !password) {
                feedback.className = 'login-feedback error';
                feedback.textContent = t('hardcoded.fillFields');
                return;
            }

            try {
                const response = await fetch('/api/challenge/info-leak/hardcoded/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const result = await response.json();

                if (result.success) {
                    feedback.className = 'login-feedback success';
                    feedback.textContent = t('hardcoded.loginSuccess') + ' Flag: ' + result.flag;
                } else {
                    feedback.className = 'login-feedback error';
                    feedback.textContent = t('hardcoded.loginFailed');
                }
            } catch (error) {
                feedback.className = 'login-feedback error';
                feedback.textContent = t('hardcoded.networkError');
            }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!flag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('hardcoded.enterFlag');
                return;
            }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'info-leak', vul_level: 'level2', flag: flag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('hardcoded.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'info-leak', level: 'level2' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('hardcoded.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('hardcoded.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
