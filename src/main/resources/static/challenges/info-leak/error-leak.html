<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误信息泄露</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .main-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 750px; margin: 0 auto; }
        .section-title { color: var(--color-gold); font-size: 1rem; margin-bottom: var(--spacing-sm); padding-bottom: var(--spacing-xs); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }

        .query-form { display: flex; gap: 8px; align-items: center; margin-bottom: var(--spacing-md); }
        .query-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 10px 14px; color: var(--color-text-primary); font-size: 0.9rem; flex: 1; max-width: 200px; }
        .query-input:focus { outline: none; border-color: var(--color-gold); }
        .query-btn { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .query-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }

        .result-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; padding: var(--spacing-md); margin-top: var(--spacing-sm); font-family: 'Courier New', monospace; font-size: 0.8rem; line-height: 1.6; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .result-box.error-response { border-color: rgba(255, 42, 42, 0.3); background: rgba(255, 42, 42, 0.05); }
        .result-box.success-response { border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.05); }

        .hint-box { margin-top: var(--spacing-md); padding: var(--spacing-sm); background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 4px; }
        .hint-box p { margin: 0; color: #60a5fa; font-size: 0.9rem; }
        .hint-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="errorLeak.title">错误信息泄露</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="errorLeak.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="errorLeak.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="main-container">
            <h3 class="section-title" data-i18n="errorLeak.queryTitle">用户信息查询</h3>
            <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: var(--spacing-sm);" data-i18n="errorLeak.queryDesc">输入用户ID查询用户信息（有效ID: 1-5）</p>

            <div class="query-form">
                <input type="text" id="query-input" class="query-input" placeholder="输入用户ID..." data-i18n-placeholder="errorLeak.inputPlaceholder" />
                <button id="query-btn" class="query-btn" data-i18n="errorLeak.queryBtn">查询</button>
            </div>

            <div id="result-box" class="result-box" style="display: none;"></div>


        </div>

        <div class="tips-box">
            <h3 data-i18n="errorLeak.tipsTitle">提示</h3>
            <ul>
                <li data-i18n="errorLeak.tip1">当应用程序无法正确处理输入时，可能会暴露内部实现细节</li>
                <li data-i18n="errorLeak.tip2">试想一下：输入框期望接收什么类型的数据？如果给它不期望的呢？</li>
                <li data-i18n="errorLeak.tip3">错误响应中的信息量远比你想象的多，每个字段都值得关注</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        const i18n = {
            'zh-CN': {
                'errorLeak.title': '错误信息泄露',
                'errorLeak.flagPlaceholder': '输入 Flag...',
                'errorLeak.submit': '提交',
                'errorLeak.queryTitle': '用户信息查询',
                'errorLeak.queryDesc': '输入用户ID查询用户信息（有效ID: 1-5）',
                'errorLeak.inputPlaceholder': '输入用户ID...',
                'errorLeak.queryBtn': '查询',
                'errorLeak.hint': '提示：当输入异常值时，应用程序可能会返回详细的错误信息。尝试输入非数字、负数、或超大数值。',
                'errorLeak.tipsTitle': '提示',
                'errorLeak.tip1': '当应用程序无法正确处理输入时，可能会暴露内部实现细节',
                'errorLeak.tip2': '试想一下：输入框期望接收什么类型的数据？如果给它不期望的呢？',
                'errorLeak.tip3': '错误响应中的信息量远比你想象的多，每个字段都值得关注',
                'errorLeak.congrats': '恭喜！错误信息泄露关卡完成！',
                'errorLeak.enterFlag': '请输入 Flag',
                'errorLeak.flagError': 'Flag 不正确',
                'errorLeak.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'errorLeak.title': 'Error Message Disclosure',
                'errorLeak.flagPlaceholder': 'Enter Flag...',
                'errorLeak.submit': 'Submit',
                'errorLeak.queryTitle': 'User Info Query',
                'errorLeak.queryDesc': 'Enter user ID to query user information (valid IDs: 1-5)',
                'errorLeak.inputPlaceholder': 'Enter user ID...',
                'errorLeak.queryBtn': 'Query',
                'errorLeak.hint': 'Tip: When abnormal values are entered, the app may return detailed error info. Try non-numeric, negative, or very large values.',
                'errorLeak.tipsTitle': 'Tips',
                'errorLeak.tip1': 'When an app fails to handle input gracefully, it may reveal internal details',
                'errorLeak.tip2': 'Think: what type of data does the input expect? What if you give it something unexpected?',
                'errorLeak.tip3': 'Error responses contain far more information than you might think - every field matters',
                'errorLeak.congrats': 'Congratulations! Error disclosure challenge completed!',
                'errorLeak.enterFlag': 'Please enter Flag',
                'errorLeak.flagError': 'Incorrect flag',
                'errorLeak.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }

        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=info-leak&vul_level=level1');
                const result = await response.json();
                if (result.status === '未开始') await updateChallengeStatus('进行中');
            } catch (error) { console.error('查询关卡状态失败:', error); }
        }

        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'info-leak', vul_level: 'level1', status: status })
                });
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'challengeStatusChanged', vulnType: 'info-leak', level: 'level1', status: status }, '*');
                }
            } catch (error) { console.error('更新关卡状态失败:', error); }
        }

        function bindEvents() {
            document.getElementById('query-btn').addEventListener('click', doQuery);
            document.getElementById('query-input').addEventListener('keypress', e => { if (e.key === 'Enter') doQuery(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function doQuery() {
            const input = document.getElementById('query-input').value;
            const resultBox = document.getElementById('result-box');

            if (!input.trim()) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box error-response';
                resultBox.textContent = JSON.stringify({ success: false, error: "Please enter a user ID" }, null, 2);
                return;
            }

            try {
                const response = await fetch(`/api/challenge/info-leak/error/user?id=${encodeURIComponent(input)}`);
                const result = await response.json();

                resultBox.style.display = 'block';
                if (result.success) {
                    resultBox.className = 'result-box success-response';
                } else {
                    resultBox.className = 'result-box error-response';
                }
                resultBox.textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box error-response';
                resultBox.textContent = 'Network error: ' + error.message;
            }
        }

        async function handleSubmitFlag() {
            const flag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!flag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('errorLeak.enterFlag');
                return;
            }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'info-leak', vul_level: 'level1', flag: flag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('errorLeak.congrats');
                    await updateChallengeStatus('已完成');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'info-leak', level: 'level1' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('errorLeak.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('errorLeak.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
