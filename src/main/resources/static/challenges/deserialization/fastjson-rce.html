<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastjson AutoType RCE</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: var(--spacing-lg); background: transparent; color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }
        .header-section { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: var(--spacing-md); padding-bottom: var(--spacing-lg); margin-bottom: var(--spacing-lg); border-bottom: 1px solid transparent; background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat; }
        .level-content h1 { font-family: var(--font-display); font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 600; color: var(--color-gold); margin: 0; white-space: nowrap; flex-shrink: 0; }
        .flag-submit-form { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .flag-input-inline { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 8px 12px; color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; width: 180px; }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .flag-submit-btn-small:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }

        .challenge-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 6px; padding: 1.5rem; max-width: 750px; margin: 0 auto; }
        .info-box { background: rgba(0, 0, 0, 0.3); border-radius: 6px; padding: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .info-box h3 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; font-size: 0.9rem; }
        .info-code { background: rgba(0, 0, 0, 0.5); border-radius: 4px; padding: var(--spacing-sm); font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--color-gold-light); white-space: pre-wrap; overflow-x: auto; }

        .form-group { margin-bottom: var(--spacing-md); }
        .form-group label { display: block; font-size: 0.9rem; color: var(--color-gold); font-weight: 500; margin-bottom: 8px; }
        .json-textarea { width: 100%; height: 180px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: var(--spacing-sm); color: var(--color-text-primary); font-family: 'Courier New', monospace; font-size: 0.85rem; resize: vertical; }
        .json-textarea:focus { outline: none; border-color: var(--color-gold); }
        .action-btn { width: 100%; background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); color: var(--color-bg-dark); border: none; border-radius: 4px; padding: 12px 24px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: var(--spacing-sm); }
        .action-btn:hover { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); }
        .secondary-btn { background: rgba(212, 175, 55, 0.15); color: var(--color-gold); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; padding: 10px 20px; font-weight: 500; cursor: pointer; font-size: 0.9rem; margin-bottom: var(--spacing-md); }
        .secondary-btn:hover { background: rgba(212, 175, 55, 0.25); }

        .result-box { margin-top: var(--spacing-md); padding: var(--spacing-md); background: rgba(0, 0, 0, 0.2); border-radius: 6px; display: none; }
        .result-box h4 { color: var(--color-gold); margin: 0 0 var(--spacing-sm) 0; }
        .result-content { font-family: 'Courier New', monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }

        .feedback { margin-top: var(--spacing-md); padding: var(--spacing-sm); border-radius: 4px; font-size: 0.9rem; text-align: center; min-height: 1.5em; }
        .feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }

        .tips-box { margin-top: var(--spacing-xl); padding: var(--spacing-md); background: rgba(212, 175, 55, 0.05); border-left: 3px solid var(--color-gold); border-radius: 4px; }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        .tips-box code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; color: var(--color-gold-light); }
    </style>
</head>
<body>
    <div class="level-content">
        <div class="header-section">
            <h1 id="page-title" data-i18n="fastjson.title">Fastjson AutoType RCE</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="fastjson.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="fastjson.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <div class="challenge-container">
            <div class="info-box">
                <h3 data-i18n="fastjson.sysInfoTitle">系统信息</h3>
                <div id="sys-info" class="info-code">Loading...</div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: var(--spacing-md);">
                <button id="get-info-btn" class="secondary-btn" style="margin-bottom: 0;" data-i18n="fastjson.getInfo">查看系统信息</button>
                <button id="get-gadget-btn" class="secondary-btn" style="margin-bottom: 0;" data-i18n="fastjson.getGadget">查看 Gadget 类信息</button>
            </div>

            <div id="gadget-info-box" class="info-box" style="display: none;">
                <h3 data-i18n="fastjson.gadgetInfoTitle">Gadget 类信息</h3>
                <div id="gadget-info" class="info-code"></div>
            </div>

            <div class="form-group">
                <label data-i18n="fastjson.jsonLabel">用户配置 JSON</label>
                <textarea id="json-input" class="json-textarea">
{
  "name": "test_user",
  "theme": "dark",
  "language": "zh-CN"
}</textarea>
            </div>

            <button id="update-btn" class="action-btn" data-i18n="fastjson.updateConfig">更新配置</button>

            <div id="result-box" class="result-box">
                <h4 data-i18n="fastjson.result">处理结果</h4>
                <div id="result-content" class="result-content"></div>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <div class="tips-box">
            <h3 data-i18n="fastjson.tips">提示</h3>
            <ul>
                <li data-i18n="fastjson.tip1">先查看系统信息，注意 JSON 解析库的版本</li>
                <li data-i18n="fastjson.tip2">查看 Gadget 类信息，了解可利用的类和触发条件</li>
                <li data-i18n="fastjson.tip3">使用 @type 字段指定 gadget 类，并提供正确的字段值</li>
                <li data-i18n="fastjson.tip4">CVE-2017-18349: Fastjson 1.2.24 及以下版本的 AutoType 漏洞</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <script>
        const i18n = {
            'zh-CN': {
                'fastjson.title': 'Fastjson AutoType RCE - 配置更新',
                'fastjson.flagPlaceholder': '输入 Flag...',
                'fastjson.submit': '提交',
                'fastjson.sysInfoTitle': '系统信息',
                'fastjson.getInfo': '查看系统信息',
                'fastjson.jsonLabel': '用户配置 JSON',
                'fastjson.updateConfig': '更新配置',
                'fastjson.result': '处理结果',
                'fastjson.tips': '提示',
                'fastjson.getGadget': '查看 Gadget 类信息',
                'fastjson.gadgetInfoTitle': 'Gadget 类信息',
                'fastjson.tip1': '先查看系统信息，注意 JSON 解析库的版本',
                'fastjson.tip2': '查看 Gadget 类信息，了解可利用的类和触发条件',
                'fastjson.tip3': '使用 @type 字段指定 gadget 类，并提供正确的字段值',
                'fastjson.tip4': 'CVE-2017-18349: Fastjson 1.2.24 及以下版本的 AutoType 漏洞',
                'fastjson.congrats': '恭喜！Fastjson AutoType RCE 关卡完成！',
                'fastjson.enterFlag': '请输入 Flag',
                'fastjson.flagError': 'Flag 不正确',
                'fastjson.networkError': '网络错误，请稍后再试'
            },
            'en-US': {
                'fastjson.title': 'Fastjson AutoType RCE - Config Update',
                'fastjson.flagPlaceholder': 'Enter Flag...',
                'fastjson.submit': 'Submit',
                'fastjson.sysInfoTitle': 'System Info',
                'fastjson.getInfo': 'View System Info',
                'fastjson.jsonLabel': 'User Config JSON',
                'fastjson.updateConfig': 'Update Config',
                'fastjson.result': 'Result',
                'fastjson.tips': 'Tips',
                'fastjson.getGadget': 'View Gadget Class Info',
                'fastjson.gadgetInfoTitle': 'Gadget Class Info',
                'fastjson.tip1': 'Check system info first - note the JSON parser version',
                'fastjson.tip2': 'View the gadget class info to learn the exploitable class and trigger conditions',
                'fastjson.tip3': 'Use @type to specify the gadget class, and provide the correct field values',
                'fastjson.tip4': 'CVE-2017-18349: Fastjson 1.2.24 and below AutoType vulnerability',
                'fastjson.congrats': 'Congratulations! Fastjson AutoType RCE challenge completed!',
                'fastjson.enterFlag': 'Please enter Flag',
                'fastjson.flagError': 'Incorrect flag',
                'fastjson.networkError': 'Network error, please try again later'
            }
        };

        function getLang() { return localStorage.getItem('lang') || 'en-US'; }
        function t(key) { const lang = getLang(); return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key; }
        function showFeedback(type, message) { const el = document.getElementById('feedback'); el.className = 'feedback ' + type; el.textContent = message; }

        async function init() {
            bindEvents();
            applyLanguage();
            fetchInfo();
            window.addEventListener('languageChanged', applyLanguage);
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) el.placeholder = i18n[lang][key];
            });
        }

        function bindEvents() {
            document.getElementById('get-info-btn').addEventListener('click', fetchInfo);
            document.getElementById('get-gadget-btn').addEventListener('click', fetchGadgetInfo);
            document.getElementById('update-btn').addEventListener('click', handleUpdate);
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        async function fetchInfo() {
            try {
                const response = await fetch('/api/challenge/deser/fastjson/info');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('sys-info').textContent = JSON.stringify(data.systemInfo, null, 2);
                }
            } catch (error) {
                document.getElementById('sys-info').textContent = 'Error loading system info';
            }
        }

        async function fetchGadgetInfo() {
            try {
                const response = await fetch('/api/challenge/deser/fastjson/gadget');
                const data = await response.json();
                if (data.success) {
                    const box = document.getElementById('gadget-info-box');
                    box.style.display = 'block';
                    document.getElementById('gadget-info').textContent = JSON.stringify(data.gadgetClass, null, 2);
                }
            } catch (error) {
                document.getElementById('gadget-info').textContent = 'Error loading gadget info';
                document.getElementById('gadget-info-box').style.display = 'block';
            }
        }

        async function handleUpdate() {
            const jsonData = document.getElementById('json-input').value.trim();
            if (!jsonData) { showFeedback('error', 'Please provide JSON data'); return; }
            try {
                const response = await fetch('/api/challenge/deser/fastjson/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: jsonData
                });
                const result = await response.json();

                document.getElementById('result-box').style.display = 'block';
                document.getElementById('result-content').textContent = JSON.stringify(result, null, 2);

                if (result.rce_triggered) {
                    showFeedback('success', result.message);
                } else if (result.success) {
                    showFeedback('success', result.message + (result.hint ? '\n' + result.hint : ''));
                } else {
                    showFeedback('error', result.message + (result.hint ? '\n' + result.hint : ''));
                }
            } catch (error) { showFeedback('error', t('fastjson.networkError')); }
        }

        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            if (!submittedFlag) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('fastjson.enterFlag'); return; }
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'deserialization', vul_level: 'level2', flag: submittedFlag })
                });
                const result = await response.json();
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('fastjson.congrats');
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'challengeCompleted', vulnType: 'deserialization', level: 'level2' }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('fastjson.flagError');
                }
            } catch (error) { flagMessage.className = 'flag-message-inline error'; flagMessage.textContent = t('fastjson.networkError'); }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
