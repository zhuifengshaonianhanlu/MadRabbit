<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token Security</title>
    <link rel="stylesheet" href="/css/vuln-types.css">
    <style>
        :root {
            --color-bg-dark: #0a0a0a;
            --color-text-primary: #f5f5f5;
            --color-text-secondary: #9a9a9a;
            --color-gold: #d4af37;
            --color-gold-light: #f4cf57;
            --color-gold-dark: #b4941f;
            --color-success: #22c55e;
            --color-danger: #ff2a2a;
            --font-display: "Georgia", serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: var(--spacing-lg); 
            background: transparent; 
            color: var(--color-text-primary); 
            font-family: var(--font-body); 
            min-height: 100vh;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: var(--spacing-md);
            padding-bottom: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            background: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212, 175, 55, 0.4) calc(100% - 1px), rgba(212, 175, 55, 0.1) 100%) bottom / 100% 1px no-repeat;
        }
        .level3-content h1 { 
            font-family: var(--font-display); 
            font-size: clamp(1rem, 3vw, 1.8rem); 
            font-weight: 600; 
            color: var(--color-gold); 
            margin: 0;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .flag-submit-form { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-shrink: 0;
        }
        .flag-input-inline { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            border-radius: 4px; 
            padding: 8px 12px; 
            color: var(--color-text-primary); 
            font-family: 'Courier New', monospace; 
            font-size: 0.85rem; 
            width: 180px; 
        }
        .flag-input-inline:focus { outline: none; border-color: var(--color-gold); }
        .flag-submit-btn-small { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 4px; 
            padding: 8px 16px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .flag-submit-btn-small:hover { 
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); 
        }
        .flag-message-inline { font-size: 0.8rem; margin-left: 8px; }
        .flag-message-inline.success { color: var(--color-success); }
        .flag-message-inline.error { color: var(--color-danger); }
        
        .jwt-info-section {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            background: rgba(212, 175, 55, 0.05);
            border-left: 3px solid var(--color-gold);
            border-radius: 4px;
        }
        .jwt-info-section h3 {
            color: var(--color-gold);
            margin-bottom: var(--spacing-sm);
            font-family: var(--font-display);
        }
        .jwt-token-display {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--color-gold-light);
        }
        .token-decode-section {
            margin-top: var(--spacing-lg);
        }
        .token-parts {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }
        .token-part {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 4px;
            padding: var(--spacing-sm);
            min-height: 100px;
        }
        .token-part-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-gold);
            margin-bottom: var(--spacing-xs);
            letter-spacing: 1px;
        }
        .token-part-content {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--color-text-primary);
            word-break: break-all;
        }
        
        .login-form-container { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 6px; 
            padding: 1.5rem; 
            max-width: 360px; 
            margin: 0 auto;
        }
        .login-form { display: flex; flex-direction: column; gap: 0.75rem; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.75rem; font-weight: 600; color: var(--color-gold); letter-spacing: 1px; }
        .form-input { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 3px; 
            padding: 0.5rem 0.75rem; 
            color: var(--color-text-primary); 
            font-size: 0.9rem; 
        }
        .form-input:focus { outline: none; border-color: var(--color-gold); }
        .login-btn { 
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark)); 
            color: var(--color-bg-dark); 
            border: none; 
            border-radius: 3px; 
            padding: 0.5rem 1rem; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 0.5rem; 
            letter-spacing: 1px;
        }
        .login-btn:hover { 
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); 
        }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-feedback { 
            margin-top: 0.5rem; 
            padding: 0.5rem; 
            border-radius: 3px; 
            font-size: 0.8rem; 
            text-align: center; 
            min-height: 1.2em; 
        }
        .login-feedback.success { background: rgba(34, 197, 94, 0.15); color: var(--color-success); border: 1px solid rgba(34, 197, 94, 0.25); }
        .login-feedback.error { background: rgba(255, 42, 42, 0.15); color: var(--color-danger); border: 1px solid rgba(255, 42, 42, 0.25); }
        
        .tips-box { 
            margin-top: var(--spacing-xl); 
            padding: var(--spacing-md); 
            background: rgba(212, 175, 55, 0.05); 
            border-left: 3px solid var(--color-gold); 
            border-radius: 4px; 
        }
        .tips-box h3 { color: var(--color-gold); margin-bottom: var(--spacing-sm); font-family: var(--font-display); }
        .tips-box ul { margin-left: var(--spacing-md); color: var(--color-text-secondary); line-height: 1.8; }
        .tips-box li { margin-bottom: 6px; }
        
        .forge-token-section {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
        }
        .forge-token-section h3 {
            color: var(--color-gold);
            margin-bottom: var(--spacing-sm);
            font-family: var(--font-display);
        }
        .forge-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        .forge-btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-bg-dark);
            border: none;
            border-radius: 3px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            align-self: flex-start;
        }
        .forge-btn:hover {
            background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
        }
        .forge-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .forge-result {
            margin-top: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--color-text-primary);
            word-break: break-all;
        }
        
        /* 用户信息显示样式 */
        .user-info-display {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            margin-top: var(--spacing-sm);
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .info-label {
            font-weight: 600;
            color: var(--color-gold);
            min-width: 80px;
        }
        .info-value {
            color: var(--color-text-primary);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .flag-input-inline { width: 140px; }
            .token-parts { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="level3-content">
        <!-- 头部区域 -->
        <div class="header-section">
            <h1 id="page-title" data-i18n="jwtsec.title">JWT 令牌安全 - 弱密钥爆破</h1>
            <div class="flag-submit-form">
                <input type="text" id="flag-input" class="flag-input-inline" data-i18n-placeholder="jwtsec.flagPlaceholder" placeholder="输入 Flag..." autocomplete="off" />
                <button id="flag-submit-btn" class="flag-submit-btn-small" data-i18n="jwtsec.submit">提交</button>
                <span id="flag-message" class="flag-message-inline"></span>
            </div>
        </div>

        <!-- 登录表单 -->
        <div class="login-form-container">
            <div class="login-form">
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" class="form-input" data-i18n-placeholder="jwtsec.usernamePlaceholder" placeholder="请输入用户名" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" class="form-input" data-i18n-placeholder="jwtsec.passwordPlaceholder" placeholder="请输入密码" autocomplete="off" />
                </div>
                <button id="login-btn" class="login-btn" data-i18n="jwtsec.login">Login</button>
                <div id="login-feedback" class="login-feedback"></div>
            </div>
        </div>

        <!-- 用户信息显示 -->
        <div id="user-info-section" class="jwt-info-section" style="display: none;">
            <h3 data-i18n="jwtsec.userInfo">用户信息</h3>
            <div class="user-info-display">
                <div class="info-row">
                    <span class="info-label" data-i18n="jwtsec.username">用户名:</span>
                    <span id="user-username" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label" data-i18n="jwtsec.role">角色:</span>
                    <span id="user-role" class="info-value"></span>
                </div>
                <div class="info-row">
                    <span class="info-label" data-i18n="jwtsec.email">邮箱:</span>
                    <span id="user-email" class="info-value"></span>
                </div>
            </div>
        </div>

        <!-- 提示 -->
        <div class="tips-box">
            <h3 data-i18n="jwtsec.tips">提示</h3>
            <ul>
                <li data-i18n="jwtsec.tip1">系统中有一个账号叫 tom，尝试通过伪造 Token 获取其权限</li>
                <li data-i18n="jwtsec.tip2">使用 HS256 算法的 JWT 如果密钥过弱，可能可以被爆破</li>
            </ul>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/i18n-config.js"></script>
    <script src="/js/i18n-manager.js"></script>
    <!-- JWT 解码库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jwt-decode/3.1.2/jwt-decode.min.js"></script>
    <script>
        let currentFlag = null;
        let currentToken = null;

        // 国际化翻译
        const i18n = {
            'zh-CN': {
                'jwtsec.title': 'JWT 令牌安全 - 弱密钥爆破',
                'jwtsec.flagPlaceholder': '输入 Flag...',
                'jwtsec.submit': '提交',
                'jwtsec.usernamePlaceholder': '请输入用户名',
                'jwtsec.passwordPlaceholder': '请输入密码',
                'jwtsec.login': 'Login',
                'jwtsec.userInfo': '用户信息',
                'jwtsec.username': '用户名',
                'jwtsec.role': '角色',
                'jwtsec.email': '邮箱',
                'jwtsec.flag': 'Flag',
                'jwtsec.tips': '提示',
                'jwtsec.tip1': '系统中有一个账号叫 tom，尝试通过伪造 Token 获取其权限',
                'jwtsec.tip2': '使用 HS256 算法的 JWT 如果密钥过弱，可以被离线爆破',
                'jwtsec.enterUserPass': '请输入用户名和密码',
                'jwtsec.loggingIn': '登录中...',
                'jwtsec.networkError': '网络错误，请稍后重试',
                'jwtsec.loginSuccess': '登录成功！',
                'jwtsec.enterFlag': '请输入 Flag',
                'jwtsec.congrats': '恭喜！挑战完成！',
                'jwtsec.flagError': 'Flag 错误'
            },
            'en-US': {
                'jwtsec.title': 'JWT Token Security - Weak Key Brute Force',
                'jwtsec.flagPlaceholder': 'Enter Flag...',
                'jwtsec.submit': 'Submit',
                'jwtsec.usernamePlaceholder': 'Enter username',
                'jwtsec.passwordPlaceholder': 'Enter password',
                'jwtsec.login': 'Login',
                'jwtsec.userInfo': 'User Information',
                'jwtsec.username': 'Username',
                'jwtsec.role': 'Role',
                'jwtsec.email': 'Email',
                'jwtsec.flag': 'Flag',
                'jwtsec.tips': 'Tips',
                'jwtsec.tip1': 'There is an account called tom in the system, try to forge a Token to get their privileges',
                'jwtsec.tip2': 'JWT using HS256 algorithm can be offline brute forced if the key is weak',
                'jwtsec.enterUserPass': 'Please enter username and password',
                'jwtsec.loggingIn': 'Logging in...',
                'jwtsec.networkError': 'Network error, please try again later',
                'jwtsec.loginSuccess': 'Login Successful!',
                'jwtsec.enterFlag': 'Please enter Flag',
                'jwtsec.congrats': 'Congratulations! Challenge completed!',
                'jwtsec.flagError': 'Incorrect flag'
            }
        };

        // 获取当前语言
        function getLang() {
            return localStorage.getItem('lang') || 'en-US';
        }

        // 获取翻译文本
        function t(key) {
            const lang = getLang();
            return i18n[lang] && i18n[lang][key] ? i18n[lang][key] : key;
        }

        // 初始化
        async function init() {
            await checkAndUpdateChallengeStatus();
            bindEvents();
            applyLanguage();
            
            window.addEventListener('languageChanged', applyLanguage);
            
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'languageChanged') {
                    localStorage.setItem('lang', event.data.language);
                    applyLanguage();
                }
            });
        }

        // 应用语言
        function applyLanguage() {
            const lang = getLang();
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[lang] && i18n[lang][key]) {
                    el.placeholder = i18n[lang][key];
                }
            });
        }

        // 查询并更新关卡状态
        async function checkAndUpdateChallengeStatus() {
            try {
                const response = await fetch('/api/challenge/status_get?vul_type=auth-session&vul_level=level3');
                const result = await response.json();
                if (result.status === '未开始') {
                    await updateChallengeStatus('进行中');
                }
            } catch (error) {
                console.error('查询关卡状态失败:', error);
            }
        }

        // 更新关卡状态
        async function updateChallengeStatus(status) {
            try {
                await fetch('/api/challenge/status_update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'auth-session', vul_level: 'level3', status: status })
                });
                
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'challengeStatusChanged',
                        vulnType: 'auth-session',
                        level: 'level3',
                        status: status
                    }, '*');
                }
            } catch (error) {
                console.error('更新关卡状态失败:', error);
            }
        }

        // 绑定事件
        function bindEvents() {
            document.getElementById('login-btn').addEventListener('click', handleLogin);
            document.getElementById('flag-submit-btn').addEventListener('click', handleSubmitFlag);
            document.getElementById('flag-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleSubmitFlag(); });
        }

        // 处理登录
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const feedbackEl = document.getElementById('login-feedback');
            const loginBtn = document.getElementById('login-btn');
            
            if (!username || !password) {
                feedbackEl.className = 'login-feedback error';
                feedbackEl.textContent = t('jwtsec.enterUserPass');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = t('jwtsec.loggingIn');
            
            try {
                const response = await fetch('/api/challenge/auth-session/jwt/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                
                if (result.success) {
                    feedbackEl.className = 'login-feedback success';
                    feedbackEl.textContent = t('jwtsec.loginSuccess');
                    currentToken = result.token;
                    
                    // 调用 user_info 接口获取并显示用户信息
                    await fetchUserInfo();
                } else {
                    feedbackEl.className = 'login-feedback error';
                    feedbackEl.textContent = result.message;
                }
            } catch (error) {
                feedbackEl.className = 'login-feedback error';
                feedbackEl.textContent = t('jwtsec.networkError');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = t('jwtsec.login');
            }
        }


        // 获取用户信息
        async function fetchUserInfo() {
            const userInfoSection = document.getElementById('user-info-section');
            
            try {
                const response = await fetch('/api/challenge/auth-session/jwt/user_info', {
                    method: 'GET',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                const result = await response.json();
                
                if (result.success && result.user) {
                    // 显示用户名、角色、邮箱三个字段
                    userInfoSection.style.display = 'block';
                    document.getElementById('user-username').textContent = result.user.username || result.user.sub || '-';
                    document.getElementById('user-role').textContent = result.user.role || '-';
                    document.getElementById('user-email').textContent = result.user.email || '-';
                    // 注意：即使接口返回 flag，也不在页面上显示
                } else {
                    console.error('获取用户信息失败:', result.message);
                }
            } catch (error) {
                console.error('获取用户信息网络错误:', error);
            }
        }

        // 处理 Flag提交
        async function handleSubmitFlag() {
            const submittedFlag = document.getElementById('flag-input').value.trim();
            const flagMessage = document.getElementById('flag-message');
            
            if (!submittedFlag) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('jwtsec.enterFlag');
                return;
            }
            
            try {
                const response = await fetch('/api/challenge/flag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vul_type: 'auth-session', vul_level: 'level3', flag: submittedFlag })
                });
                const result = await response.json();
                
                if (result.success) {
                    flagMessage.className = 'flag-message-inline success';
                    flagMessage.textContent = t('jwtsec.congrats');
                    await updateChallengeStatus('已完成');
                    
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: 'challengeCompleted',
                            vulnType: 'auth-session',
                            level: 'level3'
                        }, '*');
                    }
                } else {
                    flagMessage.className = 'flag-message-inline error';
                    flagMessage.textContent = result.message || t('jwtsec.flagError');
                }
            } catch (error) {
                flagMessage.className = 'flag-message-inline error';
                flagMessage.textContent = t('jwtsec.networkError');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
